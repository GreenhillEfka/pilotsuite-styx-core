[pytest]
testpaths = tests copilot_core/monitoring/tests copilot_core/security/tests
pythonpath = .
addopts = -v --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Skip tests that require Flask (not installed in this environment)
ignore = tests/security/test_owasp.pytest_owasp.py
    tests/security/
