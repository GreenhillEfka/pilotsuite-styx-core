components:
  schemas:
    # ---------- HABITUS ----------
    HabitusStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
        statistics:
          type: object
          properties:
            total_rules:
              type: integer
            total_events:
              type: integer
            last_mining_ms:
              type: integer
        config:
          type: object

    Rule:
      type: object
      properties:
        A:
          type: string
          description: Antecedent entity/transition
        B:
          type: string
          description: Consequent entity/transition
        dt_sec:
          type: number
          description: Time delta in seconds
        nA:
          type: integer
          description: Antecedent count
        nB:
          type: integer
          description: Consequent count
        nAB:
          type: integer
          description: Co-occurrence count
        confidence:
          type: number
          minimum: 0
          maximum: 1
        confidence_lb:
          type: number
          description: Lower bound confidence
        lift:
          type: number
        leverage:
          type: number
        score:
          type: number
        evidence:
          type: object
          properties:
            hit_examples:
              type: array
              items:
                type: object
            miss_examples:
              type: array
              items:
                type: object
            latency_quantiles:
              type: array
              items:
                type: number

    RulesResponse:
      type: object
      properties:
        status:
          type: string
        total_rules:
          type: integer
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'

    MineRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            type: object
        config:
          type: object

    MineResponse:
      type: object
      properties:
        status:
          type: string
        mining_time_sec:
          type: number
        total_input_events:
          type: integer
        discovered_rules:
          type: integer
        top_rules:
          type: array
          items:
            type: object

    DashboardCardsResponse:
      type: object
      properties:
        status:
          type: string
        cards:
          type: array
          items:
            type: object

    ZonesResponse:
      type: object
      properties:
        status:
          type: string
        zones:
          type: array
          items:
            type: object
            properties:
              zone_id:
                type: string
              name:
                type: string
              entities:
                type: array
                items:
                  type: string

    # ---------- GRAPH ----------
    GraphState:
      type: object
      properties:
        status:
          type: string
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              label:
                type: string
              domain:
                type: string
              score:
                type: number
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              type:
                type: string
              weight:
                type: number

    GraphSyncRequest:
      type: object
      properties:
        entities:
          type: array
          items:
            type: object
        full_sync:
          type: boolean
          default: false

    GraphSyncResponse:
      type: object
      properties:
        status:
          type: string
        nodes_added:
          type: integer
        nodes_updated:
          type: integer
        nodes_removed:
          type: integer
        edges_added:
          type: integer

    PatternsResponse:
      type: object
      properties:
        status:
          type: string
        patterns:
          type: array
          items:
            type: object

    # ---------- MOOD ----------
    MoodResponse:
      type: object
      properties:
        status:
          type: string
        mood:
          type: object
          properties:
            score:
              type: number
              minimum: 0
              maximum: 1
            confidence:
              type: number
            factors:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: number
                  weight:
                    type: number
        zone_id:
          type: string
        user_id:
          type: string

    # ---------- TAGS ----------
    TagsResponse:
      type: object
      properties:
        status:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    Tag:
      type: object
      properties:
        tag_id:
          type: string
        namespace:
          type: string
        facet:
          type: string
        key:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    TagCreate:
      type: object
      required:
        - tag_id
      properties:
        tag_id:
          type: string
          pattern: '^[a-z0-9_]+\.[a-z0-9_]+\.[a-z0-9_]+$'
          example: 'aicp.place.kueche'
        description:
          type: string

    TagAssignment:
      type: object
      required:
        - tag_id
      properties:
        tag_id:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum: [manual, inferred, learned]

    SubjectTagsResponse:
      type: object
      properties:
        status:
          type: string
        subject_id:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    # ---------- EVENTS ----------
    EventIngest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        text:
          type: string
        payload:
          type: object
        idempotency_key:
          type: string
        timestamp:
          type: string
          format: date-time

    EventIngestResponse:
      type: object
      properties:
        ok:
          type: boolean
        stored:
          type: boolean
        deduped:
          type: boolean
        event_id:
          type: string

    # ---------- CANDIDATES ----------
    CandidatesResponse:
      type: object
      properties:
        status:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              candidate_id:
                type: string
              trigger:
                type: object
              action:
                type: object
              score:
                type: number
              source:
                type: string

    CandidateStats:
      type: object
      properties:
        status:
          type: string
        total:
          type: integer
        by_source:
          type: object
        by_domain:
          type: object

    # ---------- SYSTEM ----------
    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        checks:
          type: object
          properties:
            api:
              type: string
              enum: [ok, error]
            storage:
              type: string
              enum: [ok, error]
            ha_connection:
              type: string
              enum: [ok, error]
        version:
          type: string
        uptime_seconds:
          type: integer

    # ---------- ENERGY ----------
    EnergySnapshot:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        total_consumption_today_kwh:
          type: number
          description: Total energy consumed today in kWh
        total_production_today_kwh:
          type: number
          description: Total solar/PV production today in kWh
        current_power_watts:
          type: number
          description: Current power draw in Watts
        peak_power_today_watts:
          type: number
          description: Peak power today in Watts
        anomalies_detected:
          type: integer
        shifting_opportunities:
          type: integer
        baselines:
          type: object
          additionalProperties:
            type: number
          description: Device type to avg daily kWh mapping

    EnergyAnomaly:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        device_id:
          type: string
        device_type:
          type: string
        expected_value:
          type: number
        actual_value:
          type: number
        deviation_percent:
          type: number
        severity:
          type: string
          enum: [low, medium, high]
        description:
          type: string

    EnergyAnomaliesResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/EnergyAnomaly'

    ShiftingOpportunity:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        device_type:
          type: string
        reason:
          type: string
          enum: [solar_oversupply, off_peak_pricing, avoid_peak_pricing]
        current_cost_eur:
          type: number
        optimal_cost_eur:
          type: number
        savings_estimate_eur:
          type: number
        suggested_window_start:
          type: string
          format: date-time
        suggested_window_end:
          type: string
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1

    ShiftingResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/ShiftingOpportunity'

    SuggestionExplanation:
      type: object
      properties:
        suggestion_id:
          type: string
        type:
          type: string
          enum: [anomaly, shifting, unknown]
        title:
          type: string
        description:
          type: string
        details:
          type: object
        actions:
          type: array
          items:
            type: string

    BaselinesResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        baselines:
          type: object
          additionalProperties:
            type: number
          description: Device type to avg daily kWh

    SuppressResponse:
      type: object
      properties:
        suppressed:
          type: boolean
        reason:
          type: string
          nullable: true
        suppress_until:
          type: string
          nullable: true
        recommendations:
          type: array
          items:
            type: string

    EnergyHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        hass_available:
          type: boolean
        cache_valid:
          type: boolean
        last_update:
          type: number
        baselines_configured:
          type: integer
        anomaly_thresholds:
          type: object
          properties:
            low:
              type: number
            medium:
              type: number
            high:
              type: number
        energy_entities_found:
          type: integer

    ZoneEnergyRegister:
      type: object
      required:
        - entity_ids
      properties:
        entity_ids:
          type: array
          items:
            type: string
          description: HA entity IDs for energy sensors
          example: ["sensor.kitchen_power", "sensor.kitchen_energy"]
        zone_name:
          type: string
          description: Display name for the zone
          example: Kitchen

    ZoneEnergyRegistered:
      type: object
      properties:
        ok:
          type: boolean
        zone_id:
          type: string
        zone_name:
          type: string
        entity_count:
          type: integer

    ZoneEnergyResponse:
      type: object
      properties:
        ok:
          type: boolean
        zone_id:
          type: string
        zone_name:
          type: string
        total_power_watts:
          type: number
        entity_count:
          type: integer
        active_count:
          type: integer
        breakdown:
          type: array
          items:
            type: object
            properties:
              entity_id:
                type: string
              value:
                type: number
                nullable: true
              status:
                type: string
                enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time

    AllZonesEnergyResponse:
      type: object
      properties:
        ok:
          type: boolean
        zones:
          type: array
          items:
            type: object
            properties:
              zone_id:
                type: string
              zone_name:
                type: string
              total_power_watts:
                type: number
              entity_count:
                type: integer
              active_count:
                type: integer
        total_zones:
          type: integer
        global_power_watts:
          type: number
        timestamp:
          type: string
          format: date-time

    SankeyNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
        color:
          type: string
        category:
          type: string

    SankeyFlow:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        value:
          type: number

    SankeyDataResponse:
      type: object
      properties:
        ok:
          type: boolean
        title:
          type: string
        unit:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SankeyNode'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/SankeyFlow'
        summary:
          type: object
          properties:
            total_consumption_kwh:
              type: number
            total_production_kwh:
              type: number
            grid_kwh:
              type: number
        timestamp:
          type: string
          format: date-time

    # ---------- COMMON ----------
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        code:
          type: string

    # ---------- NEURONS ----------
    NeuronsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            context:
              type: object
            state:
              type: object
            mood:
              type: object
            total_count:
              type: integer

    NeuronState:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        state:
          type: object
        config:
          type: object

    NeuronEvaluateRequest:
      type: object
      properties:
        states:
          type: object
        context:
          type: object
        trigger:
          type: string

    NeuronEvaluateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            timestamp:
              type: string
            context_values:
              type: object
            state_values:
              type: object
            mood_values:
              type: object
            dominant_mood:
              type: string
            mood_confidence:
              type: number
            suggestions:
              type: array
              items:
                type: string
            neuron_count:
              type: integer

    SuggestionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            suggestions:
              type: array
              items:
                type: string
            mood:
              type: string
            timestamp:
              type: string

    # ---------- VECTOR ----------
    VectorEmbeddingRequest:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [entity, user_preference, pattern]
        id:
          type: string
        domain:
          type: string
        area:
          type: string
        capabilities:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        state:
          type: object
        preferences:
          type: object
        pattern_type:
          type: string
        entities:
          type: array
          items:
            type: string
        conditions:
          type: object
        confidence:
          type: number
        metadata:
          type: object

    VectorEmbeddingResponse:
      type: object
      properties:
        ok:
          type: boolean
        entry:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            created_at:
              type: string
            metadata:
              type: object

    VectorBulkRequest:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/VectorEmbeddingRequest'
        user_preferences:
          type: array
          items:
            $ref: '#/components/schemas/VectorEmbeddingRequest'
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/VectorEmbeddingRequest'

    VectorBulkResponse:
      type: object
      properties:
        ok:
          type: boolean
        results:
          type: object
          properties:
            entities:
              type: object
              properties:
                created:
                  type: integer
                failed:
                  type: integer
            user_preferences:
              type: object
              properties:
                created:
                  type: integer
                failed:
                  type: integer
            patterns:
              type: object
              properties:
                created:
                  type: integer
                failed:
                  type: integer

    SimilarResponse:
      type: object
      properties:
        ok:
          type: boolean
        query_id:
          type: string
        query_type:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              similarity:
                type: number
              type:
                type: string
              metadata:
                type: object
        count:
          type: integer

    VectorsListResponse:
      type: object
      properties:
        ok:
          type: boolean
        entries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              created_at:
                type: string
              updated_at:
                type: string
              metadata:
                type: object
        count:
          type: integer

    VectorsClearResponse:
      type: object
      properties:
        ok:
          type: boolean
        deleted_count:
          type: integer
        type:
          type: string

    VectorDetailResponse:
      type: object
      properties:
        ok:
          type: boolean
        entry:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            vector:
              type: array
              items:
                type: number
            dimension:
              type: integer
            created_at:
              type: string
            updated_at:
              type: string
            metadata:
              type: object

    VectorDeleteResponse:
      type: object
      properties:
        ok:
          type: boolean
        deleted:
          type: string

    VectorStatsResponse:
      type: object
      properties:
        ok:
          type: boolean
        stats:
          type: object
          properties:
            total_vectors:
              type: integer
            by_type:
              type: object
            dimension:
              type: integer

    SimilarityRequest:
      type: object
      properties:
        id1:
          type: string
        id2:
          type: string
        vector1:
          type: array
          items:
            type: number
        vector2:
          type: array
          items:
            type: number

    SimilarityResponse:
      type: object
      properties:
        ok:
          type: boolean
        similarity:
          type: number
        dimension:
          type: integer

    # ---------- WEATHER ----------
    WeatherResponse:
      type: object
      properties:
        status:
          type: string
        weather:
          type: object
          properties:
            temperature:
              type: number
            humidity:
              type: number
            condition:
              type: string
            wind_speed:
              type: number
            pressure:
              type: number

    WeatherForecastResponse:
      type: object
      properties:
        status:
          type: string
        forecast:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              temp_high:
                type: number
              temp_low:
                type: number
              condition:
                type: string
              precipitation:
                type: number

    PvRecommendationsResponse:
      type: object
      properties:
        status:
          type: string
        recommendations:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
              priority:
                type: string

    # ---------- VOICE ----------
    VoiceContextResponse:
      type: object
      properties:
        status:
          type: string
        context:
          type: object
          properties:
            mood:
              type: string
            activity:
              type: string
            location:
              type: string
            time_context:
              type: string

    VoiceContextUpdateResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string

    VoicePromptResponse:
      type: object
      properties:
        status:
          type: string
        prompt:
          type: string

    VoiceMoodHistoryResponse:
      type: object
      properties:
        status:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
              mood:
                type: string
              confidence:
                type: number

    VoiceSuggestionsResponse:
      type: object
      properties:
        status:
          type: string
        suggestions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
              priority:
                type: string

    # ---------- MODULE ROUTER ----------
    ModuleRouterStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        refresh_count:
          type: integer
          description: Total number of refresh cycles since startup
        last_refresh_ago_s:
          type: number
          nullable: true
          description: Seconds since last refresh (null if never refreshed)
        modules:
          type: object
          description: Per-module status keyed by module name
          properties:
            zwave:
              $ref: '#/components/schemas/ModuleStatus'
            zigbee:
              $ref: '#/components/schemas/ModuleStatus'
            thread:
              $ref: '#/components/schemas/ModuleStatus'
            homeassistant:
              $ref: '#/components/schemas/ModuleStatus'

    ModuleStatus:
      type: object
      properties:
        available:
          type: boolean
          description: Whether the module engine is initialized
        enabled:
          type: boolean
          description: Whether the module is enabled in config
        has_data:
          type: boolean
          description: Whether the module has received data
        summary:
          type: object
          description: Module-specific summary data

    ModuleRouterConfigResponse:
      type: object
      properties:
        ok:
          type: boolean
        config:
          type: object
          description: Per-module configuration
          properties:
            zwave:
              $ref: '#/components/schemas/ZWaveConfig'
            zigbee:
              $ref: '#/components/schemas/ZigbeeConfig'
            thread:
              $ref: '#/components/schemas/ThreadConfig'
            homeassistant:
              $ref: '#/components/schemas/HAConfig'

    ModuleConfigUpdate:
      type: object
      description: Key-value pairs to update in the module config
      additionalProperties: true
      example:
        polling_interval_s: 60
        enabled: true

    ModuleConfigUpdateResponse:
      type: object
      properties:
        ok:
          type: boolean
        module:
          type: string
          description: Module name that was updated
        config:
          type: object
          description: Updated configuration

    ModuleConfigBadRequest:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        valid:
          type: array
          items:
            type: string
          example: [zwave, zigbee, thread, homeassistant]

    ModuleRefreshResponse:
      type: object
      properties:
        ok:
          type: boolean
        entity_count:
          type: integer
          description: Number of entities fetched from HA
        modules:
          type: object
          description: Per-module device counts after refresh
          additionalProperties:
            type: integer
        duration_ms:
          type: number
          description: Refresh duration in milliseconds

    ServiceUnavailableResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        hint:
          type: string

    # ---------- Z-WAVE ----------
    ZWaveConfig:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer
          description: Polling interval in seconds
          example: 120
        alert_dead_devices:
          type: boolean
          description: Whether to alert on dead Z-Wave devices
        alert_threshold_dead:
          type: integer
          description: Number of dead devices before alert

    ZWaveConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer
        alert_dead_devices:
          type: boolean
        alert_threshold_dead:
          type: integer

    ZWaveStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        protocol:
          type: string
          example: zwave
        controller_state:
          type: string
          description: Controller state (ready, not ready, error, unknown)
        device_count:
          type: integer
        devices_dead:
          type: integer
        devices_sleeping:
          type: integer
        last_heal:
          type: string
          format: date-time
          nullable: true
        error_count:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDevice'

    # ---------- ZIGBEE ----------
    ZigbeeConfig:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer
          example: 120
        alert_low_lqi:
          type: boolean
          description: Whether to alert on low LQI values
        lqi_threshold:
          type: integer
          description: LQI threshold below which alerts are triggered
          example: 50

    ZigbeeConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer
        alert_low_lqi:
          type: boolean
        lqi_threshold:
          type: integer

    ZigbeeStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        protocol:
          type: string
          example: zigbee
        coordinator_state:
          type: string
          description: Coordinator state (ready, unknown)
        device_count:
          type: integer
        avg_lqi:
          type: number
          description: Average link quality indicator across all devices
        devices_offline:
          type: integer
        last_update:
          type: string
          format: date-time
          nullable: true
        devices:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDevice'

    # ---------- THREAD ----------
    ThreadConfig:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer
          example: 120

    ThreadConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        polling_interval_s:
          type: integer

    ThreadStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        protocol:
          type: string
          example: thread
        border_router_state:
          type: string
          description: Border router state (ready, unknown)
        device_count:
          type: integer
        router_count:
          type: integer
          description: Number of Thread router devices
        last_update:
          type: string
          format: date-time
          nullable: true
        devices:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDevice'

    # ---------- SHARED NETWORK MODULE ----------
    NetworkDevice:
      type: object
      properties:
        entity_id:
          type: string
        friendly_name:
          type: string
        state:
          type: string
        is_dead:
          type: boolean
          description: Z-Wave only
        is_sleeping:
          type: boolean
          description: Z-Wave only
        lqi:
          type: integer
          nullable: true
          description: Zigbee only (link quality indicator)
        is_offline:
          type: boolean
          description: Zigbee only
        is_router:
          type: boolean
          description: Thread only
        last_seen:
          type: string
          format: date-time
          nullable: true

    NetworkDeviceListResponse:
      type: object
      properties:
        ok:
          type: boolean
        protocol:
          type: string
          enum: [zwave, zigbee, thread]
        total:
          type: integer
        devices:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDevice'

    NetworkModuleConfigResponse:
      type: object
      properties:
        ok:
          type: boolean
        protocol:
          type: string
          enum: [zwave, zigbee, thread]
        config:
          type: object
          description: Module-specific configuration

    # ---------- HOMEASSISTANT MODULE ----------
    HAConfig:
      type: object
      properties:
        enabled:
          type: boolean
        forwarded_domains:
          type: array
          items:
            type: string
          example: [light, sensor, binary_sensor, switch, climate, media_player, cover, fan]
        webhook_retry_count:
          type: integer
          example: 3
        connection_timeout_s:
          type: integer
          example: 10

    HAModuleStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        module:
          type: string
          example: homeassistant
        connection:
          type: object
          description: Connection status to HA instance
          properties:
            reachable:
              type: boolean
            response_time_ms:
              type: number
            error_count:
              type: integer
            success_count:
              type: integer
        event_forwarding:
          type: object
          description: Event forwarding statistics
          properties:
            forwarded_domains:
              type: array
              items:
                type: string
            events_forwarded_count:
              type: integer
            events_per_minute:
              type: number
            domain_counts:
              type: object
              additionalProperties:
                type: integer
        webhook:
          type: object
          description: Webhook push status (Core to HA)
          properties:
            push_count:
              type: integer
            push_errors:
              type: integer
            last_error_message:
              type: string
        supervisor:
          type: object
          description: Supervisor API health
          properties:
            reachable:
              type: boolean
            token_valid:
              type: boolean
        integration_entity_count:
          type: integer
        module_count:
          type: integer
        active_dashboard_views:
          type: array
          items:
            type: string

    HAConnectionResponse:
      type: object
      properties:
        status:
          type: string
        reachable:
          type: boolean
        response_time_ms:
          type: number
        error_count:
          type: integer
        success_count:
          type: integer

    HAEventForwardingResponse:
      type: object
      properties:
        status:
          type: string
        forwarded_domains:
          type: array
          items:
            type: string
        events_forwarded_count:
          type: integer
        events_per_minute:
          type: number
        domain_counts:
          type: object
          additionalProperties:
            type: integer

    HAEventDomainsConfig:
      type: object
      required:
        - domains
      properties:
        domains:
          type: array
          items:
            type: string
          description: List of HA domains to forward
          example: [light, switch, climate, media_player]

    HAEventDomainsConfigResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        domains:
          type: array
          items:
            type: string

    HAModuleConfigResponse:
      type: object
      properties:
        status:
          type: string
        module:
          type: string
          example: homeassistant
        config:
          type: object
          description: Full HA module configuration

    HAModuleConfigUpdate:
      type: object
      description: Configuration fields to update
      properties:
        forwarded_domains:
          type: array
          items:
            type: string
        webhook_retry_count:
          type: integer
        connection_timeout_s:
          type: integer

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedResponse:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token

security:
  - ApiKeyAuth: []