  # ==================== MODULE ROUTER ====================
  /api/v1/modules/router/status:
    get:
      tags: [ModuleRouter]
      summary: Get status of all network modules
      operationId: getModuleRouterStatus
      description: Returns status of all network modules (Z-Wave, Zigbee, Thread, HomeAssistant) via the centralized ModuleRouter
      responses:
        '200':
          description: Module router status with per-module summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleRouterStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          description: ModuleRouter service not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'

  /api/v1/modules/router/config:
    get:
      tags: [ModuleRouter]
      summary: Get configuration of all network modules
      operationId: getModuleRouterConfig
      description: Returns merged configuration (defaults + persisted) for all network modules
      responses:
        '200':
          description: All module configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleRouterConfigResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          description: ModuleRouter service not available

  /api/v1/modules/router/config/{module}:
    post:
      tags: [ModuleRouter]
      summary: Update configuration of a specific network module
      operationId: updateModuleRouterConfig
      description: Updates and persists configuration for a single network module (zwave, zigbee, thread, homeassistant)
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [zwave, zigbee, thread, homeassistant]
          description: Network module identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleConfigUpdateResponse'
        '400':
          description: Unknown module name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleConfigBadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          description: ModuleRouter service not available

  /api/v1/modules/router/refresh:
    post:
      tags: [ModuleRouter]
      summary: Trigger immediate refresh of all network modules
      operationId: refreshModuleRouter
      description: Fetches all entity states from HA via HomeAssistantClient.get_states() and routes them to all enabled network module engines
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleRefreshResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          description: ModuleRouter service not available

