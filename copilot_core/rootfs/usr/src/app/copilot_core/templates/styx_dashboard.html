<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PilotSuite — Styx Dashboard</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   PilotSuite Styx Dashboard — 7-Tab Design System v17
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0e14;--surface:#12171f;--card:#171d27;--border:#1e2a3a;
  --text:#e0e6ed;--dim:#6b7a8d;
  --accent:#7c6aef;--accent2:#9b8afb;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;
  --cyan:#22d3ee;--orange:#fb923c;--pink:#f472b6;--purple:#a78bfa;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Sidebar ── */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh}
.sidebar .logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar .logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5b4cd4);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(124,106,239,.35);flex-shrink:0}
.sidebar .logo-text{font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar .logo-ver{font-size:9px;color:var(--dim);margin-top:1px}
.sidebar nav{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--dim);padding:10px 12px;font-size:12.5px;font-weight:500;cursor:pointer;border-radius:8px;transition:all .15s;text-align:left}
.sidebar nav button:hover{background:rgba(124,106,239,.06);color:var(--text)}
.sidebar nav button.active{background:rgba(124,106,239,.12);color:var(--accent2);font-weight:600}
.sidebar nav button .nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar nav button .nav-key{margin-left:auto;font-size:9px;color:var(--border);border:1px solid var(--border);padding:1px 5px;border-radius:4px}
.sidebar .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px}
.health-dot{display:inline-block;width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Main ── */
.main{flex:1;overflow-y:auto;height:100vh}
.main-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.main-header h2{font-size:16px;font-weight:700;flex:1}
.main-header .status-pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid var(--border);background:var(--card)}
.tab-content{display:none;padding:16px 20px;max-width:1600px;margin:0 auto;animation:fadeIn .25s ease}.tab-content.active{display:block}

/* ── Cards & Utilities ── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:border-color .2s}
.card:hover{border-color:rgba(124,106,239,.25)}
.card h3{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stat{text-align:center;padding:10px 6px}
.stat .v{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:9px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.bg{background:rgba(52,211,153,.12);color:var(--green)}.by{background:rgba(251,191,36,.12);color:var(--yellow)}
.br{background:rgba(248,113,113,.12);color:var(--red)}.bb{background:rgba(96,165,250,.12);color:var(--blue)}
.bp{background:rgba(124,106,239,.12);color:var(--accent2)}.bc{background:rgba(34,211,238,.12);color:var(--cyan)}
.bo{background:rgba(251,146,60,.12);color:var(--orange)}
.empty{text-align:center;padding:30px;color:var(--dim);font-size:12px}
.gauge{margin:6px 0}.gauge-hd{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:3px}.gauge-hd .gv{color:var(--text);font-weight:600}
.gauge-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.gauge-fill{height:100%;border-radius:3px;transition:width .8s ease}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--text);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-sm{padding:4px 10px;font-size:10px;border-radius:6px}
.btn-green{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.btn-red{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red)}
.section{margin-bottom:20px}
.section-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
.section-hd h3{font-size:13px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:0}

/* ── Styx Tab ── */
.styx-layout{display:grid;grid-template-columns:1fr 380px;gap:14px;height:calc(100vh - 110px);min-height:500px}
.styx-left{display:flex;flex-direction:column;gap:12px;min-height:0}
.styx-right{display:flex;flex-direction:column;gap:12px;min-height:0}
.brain-wrap{flex:1;min-height:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.brain-wrap canvas{width:100%;height:100%;display:block}
.brain-stats{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.brain-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;display:flex;align-items:center;gap:6px;flex:1;min-width:120px}
.brain-chip .chip-v{font-weight:700;color:var(--accent2)}
.brain-chip .chip-l{color:var(--dim);font-size:10px}

/* ── Chat ── */
.chat-panel{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-hd{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--accent2);flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.chat-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:2px}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none}
.chat-input input:focus{border-color:var(--accent)}

/* ── Mood ── */
.mood-gauge{width:160px;height:160px;border-radius:50%;position:relative;margin:0 auto 16px}
.mood-gauge .mg-inner{position:absolute;top:12px;left:12px;right:12px;bottom:12px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mood-gauge .mg-emoji{font-size:32px}
.mood-gauge .mg-label{font-size:11px;font-weight:600;margin-top:4px}
.mood-gauge .mg-conf{font-size:9px;color:var(--dim);margin-top:2px}
.mood-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.mood-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all .15s}
.mood-card.active{border-color:var(--accent);background:rgba(124,106,239,.08)}
.mood-card .mc-emoji{font-size:24px}
.mood-card .mc-name{font-size:11px;font-weight:600;margin-top:4px}

/* ── Zone Cards ── */
.zone-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}
.zone-card:hover{border-color:rgba(124,106,239,.3)}
.zone-card-hd{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.zone-card-hd .zc-icon{font-size:20px;width:36px;height:36px;border-radius:10px;background:rgba(124,106,239,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zone-card-hd .zc-info{flex:1;min-width:0}
.zone-card-hd .zc-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-card-hd .zc-meta{font-size:10px;color:var(--dim);margin-top:2px}
.zone-card-hd .zc-mode{font-size:9px;padding:2px 8px;border-radius:6px;font-weight:600}
.zone-modules{padding:0}
.zone-mod-section{border-bottom:1px solid var(--border)}
.zone-mod-section:last-child{border-bottom:none}
.zone-mod-hd{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:11px;font-weight:600;transition:background .15s}
.zone-mod-hd:hover{background:rgba(124,106,239,.04)}
.zone-mod-hd .zm-dot{width:8px;height:8px;border-radius:50%}
.zone-mod-hd .zm-count{margin-left:auto;font-size:9px;color:var(--dim)}
.zone-mod-hd .zm-arrow{font-size:8px;color:var(--dim);transition:transform .2s}
.zone-mod-body{display:none;padding:8px 16px 12px}
.zone-mod-body.open{display:block}
.zone-mod-field{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.zone-mod-field label{flex:1;color:var(--dim)}
.zone-mod-field input[type=range]{width:100px;accent-color:var(--accent)}
.zone-mod-field input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.zone-mod-field .zmf-val{font-weight:600;min-width:40px;text-align:right;color:var(--text)}
.tags-panel{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.tag-badge{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid var(--border)}
.cand-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.cand-card .cc-title{font-size:12px;font-weight:600;margin-bottom:4px}
.cand-card .cc-desc{font-size:11px;color:var(--dim);margin-bottom:8px;line-height:1.4}
.cand-card .cc-actions{display:flex;gap:6px}
.settings-group{margin-bottom:20px}
.settings-group h3{font-size:12px;font-weight:600;color:var(--accent2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.settings-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(30,42,58,.5);font-size:12px}
.settings-row .sr-label{flex:1;color:var(--dim)}
.settings-row .sr-value{font-weight:600}

@media(max-width:900px){.styx-layout{grid-template-columns:1fr}.sidebar{width:60px}.sidebar nav button span:not(.nav-icon){display:none}.sidebar .logo-text,.sidebar .logo-ver,.sidebar nav button .nav-key{display:none}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">&#x2604;</div>
    <div>
      <div class="logo-text">Styx Dashboard</div>
      <div class="logo-ver" id="ver-pill">v--</div>
    </div>
  </div>
  <nav id="nav">
    <button data-tab="styx" class="active"><span class="nav-icon">&#x1F9E0;</span><span>Styx</span><span class="kbd-hint nav-key">1</span></button>
    <button data-tab="module"><span class="nav-icon">&#x2699;</span><span>Module</span><span class="kbd-hint nav-key">2</span></button>
    <button data-tab="mood"><span class="nav-icon">&#x1F3AD;</span><span>Stimmung</span><span class="kbd-hint nav-key">3</span></button>
    <button data-tab="habitus"><span class="nav-icon">&#x1F50D;</span><span>Habitus</span><span class="kbd-hint nav-key">4</span></button>
    <button data-tab="zones"><span class="nav-icon">&#x1F3E0;</span><span>Habituszonen</span><span class="kbd-hint nav-key">5</span></button>
    <button data-tab="status"><span class="nav-icon">&#x1F4CA;</span><span>Status</span><span class="kbd-hint nav-key">6</span></button>
    <button data-tab="settings"><span class="nav-icon">&#x2699;</span><span>Einstellungen</span><span class="kbd-hint nav-key">7</span></button>
  </nav>
  <div class="sidebar-footer">
    <span class="health-dot" id="health-dot" style="background:var(--dim)"></span>
    <span id="health-label">Verbinde...</span>
  </div>
</aside>

<div class="main">
  <header class="main-header">
    <h2 id="tab-title">Styx</h2>
    <div class="status-pill" id="mood-pill">&#x1F3AD; <span id="mood-pill-text">--</span></div>
    <div class="status-pill" id="uptime-pill">&#x23F1; <span id="uptime-text">--</span></div>
    <div class="status-pill" id="refresh-countdown"></div>
  </header>
  <div id="summary-strip" class="summary-strip"></div>

  <!-- Tab 1: Styx -->
  <div class="tab-content active" id="tab-styx">
    <div class="styx-layout">
      <div class="styx-left">
        <div class="brain-wrap"><canvas id="brain-canvas"></canvas></div>
        <div class="brain-stats" id="brain-stats"></div>
      </div>
      <div class="styx-right">
        <div class="chat-panel">
          <div class="chat-hd">&#x1F4AC; Styx Chat</div>
          <div class="chat-msgs" id="chat-msgs"></div>
          <div class="chat-input">
            <input type="text" id="chat-in" placeholder="Nachricht an Styx..." autocomplete="off">
            <button class="btn" onclick="sendChat()">&#x27A4;</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: Module -->
  <div class="tab-content" id="tab-module"><div id="module-list" class="grid g2"></div></div>

  <!-- Tab 3: Stimmung -->
  <div class="tab-content" id="tab-mood">
    <div class="grid g2">
      <div class="card" style="text-align:center">
        <h3>&#x1F3AF; Aktuelle Stimmung</h3>
        <div class="mood-gauge" id="mood-gauge">
          <div class="mg-inner">
            <div class="mg-emoji" id="mood-emoji">&#x1F610;</div>
            <div class="mg-label" id="mood-label">Neutral</div>
            <div class="mg-conf" id="mood-conf">0%</div>
          </div>
        </div>
        <div class="mood-cards" id="mood-cards"></div>
      </div>
      <div class="card">
        <h3>&#x1F4CA; Dimensionen</h3>
        <div id="mood-dims"></div>
        <h3 style="margin-top:16px">&#x1F4C8; Verlauf</h3>
        <div id="mood-history"></div>
      </div>
    </div>
  </div>

  <!-- Tab 4: Habitus -->
  <div class="tab-content" id="tab-habitus">
    <div class="grid g3" id="habitus-stats"></div>
    <h3 style="margin:16px 0 10px;font-size:13px;font-weight:700">&#x1F4A1; Vorschlaege</h3>
    <div id="candidates-list"></div>
  </div>

  <!-- Tab 5: Habituszonen -->
  <div class="tab-content" id="tab-zones">
    <div class="grid g2" id="zones-grid"></div>
    <div class="card" style="margin-top:16px">
      <h3>&#x1F3F7; Tag-System</h3>
      <div class="tags-panel" id="tags-panel"></div>
    </div>
  </div>

  <!-- Tab 6: Status -->
  <div class="tab-content" id="tab-status"><div class="grid g3" id="status-cards"></div></div>

  <!-- Tab 7: Einstellungen -->
  <div class="tab-content" id="tab-settings"><div class="grid g2" id="settings-content"></div></div>
</div>

<!-- Zone Detail Modal -->
<div id="zone-detail-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none">
  <div style="max-width:600px;margin:10vh auto;background:var(--card);border-radius:12px;padding:24px;position:relative">
    <button onclick="closeZoneModal()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer">&times;</button>
    <div id="zone-modal-content"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   PilotSuite Styx Dashboard — JS v17
   ═══════════════════════════════════════════════════════════════════ */
const BASE = location.origin;
const TOKEN = new URLSearchParams(location.search).get('token') || '';
let activeTab = 'styx', refreshTimer = null, moduleSchemas = {}, chatHistory = [];
let brainData = { nodes: 0, edges: 0 }, neuronsData = {};

async function fetchJSON(url) {
  const h = {}; if (TOKEN) h['X-Auth-Token'] = TOKEN;
  try { const r = await fetch(BASE + url, { headers: h, signal: AbortSignal.timeout(8000) }); if (!r.ok) return null; return await r.json(); } catch { return null; }
}
async function postJSON(url, body) {
  const h = { 'Content-Type': 'application/json' }; if (TOKEN) h['X-Auth-Token'] = TOKEN;
  try { const r = await fetch(BASE + url, { method: 'POST', headers: h, body: JSON.stringify(body), signal: AbortSignal.timeout(30000) }); return await r.json(); } catch { return null; }
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function $(id) { return document.getElementById(id); }

// ── Navigation ──
const TABS = ['styx','module','mood','habitus','zones','status','settings'];
const TAB_TITLES = { styx:'Styx', module:'Module', mood:'Stimmung', habitus:'Habitus', zones:'Habituszonen', status:'Status', settings:'Einstellungen' };
function switchTab(tabName) {
  if (!TABS.includes(tabName)) return; activeTab = tabName;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  $('tab-' + tabName).classList.add('active');
  document.querySelector(`#nav button[data-tab="${tabName}"]`).classList.add('active');
  $('tab-title').textContent = TAB_TITLES[tabName];
  localStorage.setItem('styx-active-tab', tabName);
  refreshActiveTab();
}
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'Escape') closeZoneModal(); if (e.key === 'r') refreshActiveTab(); const i = parseInt(e.key); if (i >= 1 && i <= 7) switchTab(TABS[i - 1]); });

const refreshInterval = 30; let refreshCountdown = refreshInterval;
function startAutoRefresh() { if (refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(() => { refreshCountdown--; const el = $('refresh-countdown'); if (el) el.textContent = `(${refreshCountdown}s)`; if (refreshCountdown <= 0) { refreshCountdown = refreshInterval; refreshActiveTab(); } }, 1000); }
function closeZoneModal() { const m = $('zone-detail-modal'); if (m) m.style.display = 'none'; }
async function refreshActiveTab() {
  switch (activeTab) { case 'styx': await loadStyx(); break; case 'module': await loadModules(); break; case 'mood': await loadMood(); break; case 'habitus': await loadHabitus(); break; case 'zones': await loadZones(); break; case 'status': await loadStatus(); break; case 'settings': await loadSettings(); break; }
}

function formatUptime(s) { if (!s) return '--'; const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function chip(label, value, color) { return `<div class="brain-chip"><span class="chip-v" style="color:${color}">${value}</span><span class="chip-l">${label}</span></div>`; }

// ══════════════════════════════════════════════════════════════════════
// TAB 1: STYX
// ══════════════════════════════════════════════════════════════════════
async function loadStyx() {
  const [health, graph, neurons, mood] = await Promise.all([fetchJSON('/api/v1/health/deep'), fetchJSON('/api/v1/graph/stats'), fetchJSON('/api/v1/neurons'), fetchJSON('/api/v1/mood/state')]);
  if (health) {
    $('health-dot').style.background = health.ok !== false ? 'var(--green)' : 'var(--red)';
    $('health-label').textContent = health.ok !== false ? 'Verbunden' : 'Fehler';
    $('ver-pill').textContent = 'v' + (health.version || health.data?.version || '--');
    if (health.uptime_s) $('uptime-text').textContent = formatUptime(health.uptime_s);
  }
  if (graph) { brainData.nodes = graph.nodes || graph.node_count || 0; brainData.edges = graph.edges || graph.edge_count || 0; }
  const nc = neurons?.neurons ? Object.keys(neurons.neurons).length : 0;
  const fc = neurons?.neurons ? Object.values(neurons.neurons).filter(n => n.firing || n.active).length : 0;
  neuronsData = neurons?.neurons || {};
  const ms = mood?.mood || mood?.state || 'neutral';
  $('mood-pill-text').textContent = ms;
  $('brain-stats').innerHTML = [chip('Nodes', brainData.nodes, 'var(--cyan)'), chip('Edges', brainData.edges, 'var(--blue)'), chip('Neuronen', nc, 'var(--purple)'), chip('Aktiv', fc, 'var(--green)'), chip('Mood', ms, 'var(--pink)'), chip('Events', graph?.total_events || 0, 'var(--orange)')].join('');
  drawBrain();
}

function drawBrain() {
  const canvas = $('brain-canvas'); if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio; canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
  const W = rect.width, H = rect.height, cx = W / 2, cy = H / 2;
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) / 2);
  grad.addColorStop(0, 'rgba(124,106,239,.06)'); grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  const layers = [
    { r: Math.min(W, H) * 0.35, color: 'rgba(34,211,238,.4)', count: 8 },
    { r: Math.min(W, H) * 0.24, color: 'rgba(167,139,250,.5)', count: 6 },
    { r: Math.min(W, H) * 0.12, color: 'rgba(244,114,182,.6)', count: 4 },
  ];
  const nList = Object.values(neuronsData); let ni = 0;
  layers.forEach(layer => {
    ctx.beginPath(); ctx.arc(cx, cy, layer.r, 0, Math.PI * 2); ctx.strokeStyle = layer.color; ctx.lineWidth = 1; ctx.stroke();
    for (let i = 0; i < layer.count; i++) {
      const a = (i / layer.count) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * layer.r, y = cy + Math.sin(a) * layer.r;
      const n = nList[ni++]; const firing = n?.firing || n?.active || false; const sz = firing ? 6 : 4;
      ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2);
      ctx.fillStyle = firing ? layer.color.replace(/[\d.]+\)/, '1)') : layer.color; ctx.fill();
      if (firing) { ctx.beginPath(); ctx.arc(x, y, sz + 4, 0, Math.PI * 2); ctx.strokeStyle = layer.color; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
  });
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10);
  cg.addColorStop(0, 'rgba(124,106,239,.8)'); cg.addColorStop(1, 'rgba(124,106,239,.2)');
  ctx.fillStyle = cg; ctx.fill();
}

// ── Chat ──
$('chat-in').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
async function sendChat() {
  const input = $('chat-in'); const msg = input.value.trim(); if (!msg) return; input.value = '';
  chatHistory.push({ role: 'user', text: msg }); renderChat();
  const resp = await postJSON('/api/v1/chat', { message: msg, mode: 'conversational' });
  chatHistory.push({ role: 'bot', text: resp?.response || resp?.reply || resp?.message || 'Keine Antwort' }); renderChat();
}
function renderChat() { const el = $('chat-msgs'); el.innerHTML = chatHistory.map(m => `<div class="chat-msg ${m.role}">${esc(m.text)}</div>`).join(''); el.scrollTop = el.scrollHeight; }

}

const ME = { neutral:'&#x1F610;', relax:'&#x1F60C;', focus:'&#x1F9D0;', active:'&#x26A1;', sleep:'&#x1F634;', alert:'&#x1F6A8;', social:'&#x1F91D;', recovery:'&#x1F33F;', night:'&#x1F319;', stress:'&#x1F62B;' };
const MC = { neutral:'var(--dim)', relax:'var(--green)', focus:'var(--blue)', active:'var(--yellow)', sleep:'var(--purple)', alert:'var(--red)', social:'var(--cyan)', recovery:'var(--green)', night:'var(--purple)', stress:'var(--orange)' };

async function loadMood() {
  const data = await fetchJSON('/api/v1/mood/state'); if (!data) return;
  const mood = data.mood || data.state || 'neutral', conf = Math.round((data.confidence || 0) * 100), color = MC[mood] || 'var(--dim)';
  $('mood-gauge').style.background = `conic-gradient(${color} ${conf}%, var(--border) ${conf}%)`;
  $('mood-emoji').innerHTML = ME[mood] || '&#x1F610;'; $('mood-label').textContent = mood.charAt(0).toUpperCase() + mood.slice(1); $('mood-conf').textContent = conf + '%';
  $('mood-cards').innerHTML = ['neutral','relax','focus','active','sleep','alert'].map(s => `<div class="mood-card ${s === mood ? 'active' : ''}"><div class="mc-emoji">${ME[s] || ''}</div><div class="mc-name">${s}</div></div>`).join('');
  const dims = data.dimensions || {};
  $('mood-dims').innerHTML = ['arousal','valence','dominance','engagement','stress'].map(d => { const v = Math.round((dims[d] || 0) * 100); return `<div class="gauge"><div class="gauge-hd"><span>${d}</span><span class="gv">${v}%</span></div><div class="gauge-bar"><div class="gauge-fill" style="width:${v}%;background:var(--accent)"></div></div></div>`; }).join('');
  const hist = data.history || [];
  $('mood-history').innerHTML = hist.length ? hist.slice(0, 10).map(h => `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(30,42,58,.5)"><span>${ME[h.mood] || ''}</span><span style="flex:1">${esc(h.mood || '--')}</span><span style="color:var(--dim)">${h.timestamp ? new Date(h.timestamp * 1000).toLocaleTimeString('de-DE') : '--'}</span></div>`).join('') : '<div class="empty">Kein Verlauf</div>';
}

async function loadHabitus() {
  const [habitus, cands] = await Promise.all([fetchJSON('/api/v1/habitus'), fetchJSON('/api/v1/candidates')]);
  const patterns = habitus?.patterns || [];
  const avgC = patterns.length ? (patterns.reduce((s, p) => s + (p.confidence || 0), 0) / patterns.length * 100).toFixed(0) : 0;
  const avgS = patterns.length ? (patterns.reduce((s, p) => s + (p.support || 0), 0) / patterns.length * 100).toFixed(0) : 0;
  $('habitus-stats').innerHTML = [`<div class="card"><div class="stat"><div class="v">${patterns.length}</div><div class="l">Muster entdeckt</div></div></div>`, `<div class="card"><div class="stat"><div class="v">${avgC}%</div><div class="l">Durchschn. Konfidenz</div></div></div>`, `<div class="card"><div class="stat"><div class="v">${avgS}%</div><div class="l">Durchschn. Support</div></div></div>`].join('');
  const items = cands?.candidates || cands?.items || [];
  $('candidates-list').innerHTML = items.length ? items.map(c => `<div class="cand-card"><div class="cc-title">${esc(c.title || c.pattern_key || 'Vorschlag')}</div><div class="cc-desc">${esc(c.explanation || c.description || '--')}</div><div style="display:flex;gap:4px;font-size:10px;margin-bottom:6px"><span class="badge bp">${Math.round((c.confidence || 0) * 100)}% Konfidenz</span><span class="badge bc">${Math.round((c.score || 0) * 100)}% Score</span></div><div class="cc-actions"><button class="btn btn-sm btn-green" onclick="candFB('${esc(c.id || '')}',true)">&#x2713; Annehmen</button><button class="btn btn-sm btn-red" onclick="candFB('${esc(c.id || '')}',false)">&#x2717; Ablehnen</button></div></div>`).join('') : '<div class="empty">Keine Vorschlaege vorhanden</div>';
}
async function candFB(id, acc) { await postJSON('/api/v1/suggestions/feedback', { suggestion_id: id, accepted: acc }); loadHabitus(); }

async function loadZones() {
  const [dashboard, schemas, tags] = await Promise.all([fetchJSON('/api/v1/zone-automation/dashboard'), fetchJSON('/api/v1/zone-automation/module-schemas'), fetchJSON('/api/v1/zone-automation/tags')]);
  if (schemas?.schemas) moduleSchemas = schemas.schemas;
  const zones = dashboard?.zones || [], el = $('zones-grid');
  el.innerHTML = zones.map(z => {
    const zid = z.zone_id || '', cfg = z.config || {}, state = z.state || {};
    const mode = cfg.automation_mode || state.automation_mode || 'off';
    const modeC = mode === 'autonomy' ? 'bg' : mode === 'learning' ? 'by' : 'br';
    const mood = state.current_mood || 'neutral', name = cfg.zone_name || zid;
    const modules = cfg.modules || {};
    let ms = '';
    for (const [mid, schema] of Object.entries(moduleSchemas)) {
      const mc = modules[mid] || {}, color = schema.color || 'var(--dim)';
      const fields = (schema.fields || []).filter(f => f.key !== 'enabled'), en = mc.enabled !== false;
      ms += `<div class="zone-mod-section"><div class="zone-mod-hd" onclick="toggleMod(this)"><span class="zm-dot" style="background:${color}"></span><span>${esc(schema.name_de || mid)}</span><span class="badge ${en ? 'bg' : 'br'}" style="font-size:8px">${en ? 'An' : 'Aus'}</span><span class="zm-count">${fields.length} Param.</span><span class="zm-arrow">&#x25B6;</span></div><div class="zone-mod-body"><div class="zone-mod-field"><label>Aktiv</label><input type="checkbox" ${en ? 'checked' : ''} onchange="setMF('${zid}','${mid}','enabled',this.checked)"></div>${fields.map(f => renderF(zid, mid, f, mc)).join('')}</div></div>`;
    }
    return `<div class="zone-card"><div class="zone-card-hd"><div class="zc-icon">&#x1F3E0;</div><div class="zc-info"><div class="zc-name">${esc(name)}</div><div class="zc-meta">${esc(zid)} &middot; ${ME[mood] || ''} ${mood}</div></div><span class="zc-mode badge ${modeC}">${mode}</span></div><div class="zone-modules">${ms}</div></div>`;
  }).join('');
  const tagDefs = tags?.tags || {};
  $('tags-panel').innerHTML = Object.entries(tagDefs).map(([tid, t]) => `<div class="tag-badge" style="background:${(t.color || '#666')}22;color:${t.color || '#666'};border-color:${t.color || '#666'}44">${esc(t.name_de || tid)}</div>`).join('');
}
function renderF(zid, mid, f, cfg) {
  const val = cfg[f.key] ?? f.default;
  if (f.field_type === 'bool' || f.ha_platform === 'switch') return `<div class="zone-mod-field"><label>${esc(f.label_de || f.key)}</label><input type="checkbox" ${val ? 'checked' : ''} onchange="setMF('${zid}','${mid}','${f.key}',this.checked)"></div>`;
  const min = f.min_value ?? 0, max = f.max_value ?? 100, step = f.step ?? 1, unit = f.unit || '';
  return `<div class="zone-mod-field"><label>${esc(f.label_de || f.key)}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="this.nextElementSibling.textContent=this.value+'${unit}'" onchange="setMF('${zid}','${mid}','${f.key}',parseFloat(this.value))"><span class="zmf-val">${val}${unit}</span></div>`;
}
function toggleMod(hd) { const b = hd.nextElementSibling, a = hd.querySelector('.zm-arrow'); b.classList.toggle('open'); a.style.transform = b.classList.contains('open') ? 'rotate(90deg)' : ''; }
async function setMF(zid, mid, key, val) { await postJSON(`/api/v1/zone-automation/zones/${zid}/config`, { modules: { [mid]: { [key]: val } } }); }

  if (perf) { const m = perf.metrics || perf; let pr = ''; if (typeof m === 'object') for (const [k, v] of Object.entries(m).slice(0, 8)) pr += `<div class="settings-row"><span class="sr-label">${esc(k)}</span><span class="sr-value">${typeof v === 'number' ? v.toFixed(1) : esc(String(v))}</span></div>`; cards.push(`<div class="card"><h3>&#x26A1; Performance</h3>${pr || '<div class="empty">Keine Daten</div>'}</div>`); }
