- id: kaffeemaschine_kaffeemuehle_sync
  alias: "Kaffeemaschine & Kaffemuehle synchronisieren"
  description: "Schaltet die Kaffemuehle synchron mit der Kaffeemaschine ein/aus und sendet TTS-Nachrichten"
  mode: single
  trigger:
    - platform: state
      entity_id: switch.kaffeemaschine
      to:
        - "on"
        - "off"
      from:
        - "on"
        - "off"
  condition:
    - condition: template
      value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
  action:
    - service: switch.turn_{{ trigger.to_state.state }}
      target:
        entity_id: switch.kaffeemuhle
    - service: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.gangbereich
        message: >
          {% if trigger.to_state.state == 'on' %}
            Kaffeemaschine eingeschaltet. Der Kaffee kommt!
          {% else %}
            Kaffeemaschine ist aus. Kaffee-Modus beendet.
          {% endif %}

- id: kaffeemaschine_auto_off_timer
  alias: "Kaffeemaschine Auto-Aus nach 30 Minuten"
  description: "Schaltet die Kaffeemaschine automatisch nach 30 Min aus (Energiesparen, Sicherheit)"
  mode: restart
  trigger:
    - platform: state
      entity_id: switch.kaffeemaschine
      to: "on"
      for:
        minutes: 30
  action:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.kaffeemaschine
          - switch.kaffeemuhle
    - service: tts.speak
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.gangbereich
        message: "Kaffeemaschine wurde nach 30 Minuten automatisch ausgeschaltet."
