name: PilotSuite Core
version: "20.0.8"
slug: pilotsuite
description: "PilotSuite Styx — AI Home Copilot with Brain Architecture, Neural Sensors, and local LLM conversation."
url: https://github.com/GreenhillEfka/pilotsuite-styx-core
arch:
  - amd64
  - aarch64
homeassistant: "2024.1.0"
startup: services
boot: auto
init: false
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8909
host_network: true

# Persistent storage
map:
  - addon_config:rw
  - share:rw

# Mount addon_config to /data for persistent storage
options:
  log_level: info
  ollama_host: localhost
  ollama_port: 11434
schema:
  log_level: list(critical|error|warning|info|debug)
  ollama_host: str
  ollama_port: int

panel_icon: mdi:brain
panel_title: PilotSuite

ports:
  8909/tcp: 8909
