name: PilotSuite Core
version: 1.0.0
slug: pilotsuite_core
description: AI-Powered Smart Home Automation Engine
url: https://github.com/GreenhillEfka/pilotsuite-styx-core
arch:
  - amd64
  - arm64
  - armv7
init: false
startup: services
boot: auto
services:
  - redis:need
ports:
  8909/tcp: 8909
  8909/udp: 8909
ports_description:
  8909/tcp: REST API Server
  8909/udp: WebSocket Server
map:
  - config:rw
  - ssl
env:
  PILOTSUITE_VERSION: "16.0.0"
  PILOTSUITE_PORT: "8909"
  PILOTSUITE_HOST: "localhost"
options:
  auth:
    secret: "change-me-in-production"
    token_expiry_hours: 24
  database:
    path: "pilotsuite.db"
    wal_mode: true
  api:
    host: "0.0.0.0"
    port: 8909
    rate_limit: 100
  logging:
    level: "INFO"
schema:
  auth:
    secret: str
    token_expiry_hours: int?
  database:
    path: str?
    wal_mode: bool?
  api:
    host: str?
    port: port?
    rate_limit: int?
  logging:
    level: list(debug|info|warning|error)?
