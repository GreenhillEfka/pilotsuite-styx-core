components:
  schemas:
    Candidate:
      type: object
      properties:
        id:
          type: string
          description: Unique candidate identifier
        pattern_id:
          type: string
          description: Source pattern ID
        state:
          type: string
          enum:
          - pending
          - offered
          - accepted
          - dismissed
          - deferred
          description: Current candidate state
        title:
          type: string
          description: Candidate title
        description:
          type: string
          description: Candidate description
        automation_yaml:
          type: string
          description: Generated automation YAML
        confidence:
          type: number
          description: Confidence score (0-1)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deferred_until:
          type: string
          format: date-time
      required:
      - id
      - state
      - title
      - created_at
    CandidateInput:
      type: object
      properties:
        pattern_id:
          type: string
        title:
          type: string
        description:
          type: string
        automation_yaml:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
      - pattern_id
      - title
      - automation_yaml
    NotificationRequest:
      type: object
      properties:
        title:
          type: string
          description: Notification title
        message:
          type: string
          description: Notification message
        type:
          type: string
          enum:
          - mood_change
          - alert
          - suggestion
          - system
          - info
          - warning
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
          default: normal
        channel:
          type: string
          enum:
          - push
          - telegram
          - email
          - all
        data:
          type: object
          description: Additional payload data
      required:
      - title
      - message
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        delivered_at:
          type: string
          format: date-time
    SharedEntity:
      type: object
      properties:
        entity_id:
          type: string
          description: Home Assistant entity ID
        name:
          type: string
          description: Entity display name
        type:
          type: string
          description: Entity type
        home_id:
          type: string
          description: Source home identifier
        capabilities:
          type: array
          items:
            type: string
        metadata:
          type: object
      required:
      - entity_id
      - name
      - type
      - home_id
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication for most endpoints
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication for Notifications and Telegram APIs
