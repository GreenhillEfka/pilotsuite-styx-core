openapi: 3.0.3
info:
  title: PilotSuite Phase 5 & 6 API
  description: |
    OpenAPI-Spezifikation für PilotSuite Phase 5 (Cross-Home Sharing) und Phase 6 (Type Hints & Test Coverage).
    
    ## Phase 5 Modules
    - **Notifications API** (21 Endpoints): Benachrichtigungen, Device-Subscriptions, HA-Integration
    - **Sharing API** (16 Endpoints): Entity Registry, Sync, Discovery für Cross-Home Sharing
    - **Collective Intelligence API** (15 Endpoints): Federated Learning, Knowledge Transfer
    
    ## Phase 6 Features
    - Durchgängige Type Hints in allen Modulen
    - 2526 Tests mit 98% Pass-Rate
    - Flask v3.1.3 und NumPy v2.4.2 Integration
    
    ## Authentication
    - Notifications API: Bearer Token
    - Sharing API: Auth Token (X-Auth-Token Header, preferred since v13.5.3) or API Key (X-API-Key Header, deprecated)
    - Collective Intelligence API: Auth Token (X-Auth-Token Header, preferred since v13.5.3) or API Key (X-API-Key Header, deprecated)
  version: 12.0.0
  contact:
    name: PilotSuite
    url: https://github.com/pilotsuite

servers:
  - url: http://localhost:8909
    description: Local development server
  - url: http://homeassistant.local:8909
    description: Home Assistant network server

tags:
  - name: Notifications
    description: Benachrichtigungen und Device-Subscriptions
  - name: Sharing
    description: Cross-Home Entity Sharing
  - name: Federated Learning
    description: Collective Intelligence und Federated Learning

# Security Schemes
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  # =============================================================================
  # NOTIFICATIONS API
  # =============================================================================
  /api/v1/notifications/send:
    post:
      tags:
        - Notifications
      summary: Benachrichtigung senden
      operationId: sendNotification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Benachrichtigung erfolgreich gesendet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Ungültige Anfrage
        '401':
          description: Nicht autorisiert

  /api/v1/notifications:
    get:
      tags:
        - Notifications
      summary: Benachrichtigungen auflisten
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            type: string
            enum: [mood_change, alert, suggestion, system, info, warning]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Liste der Benachrichtigungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsListResponse'

  /api/v1/notifications/{notification_id}/read:
    post:
      tags:
        - Notifications
      summary: Benachrichtigung als gelesen markieren
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Erfolgreich als gelesen markiert
        '404':
          description: Benachrichtigung nicht gefunden

  /api/v1/notifications/{notification_id}:
    delete:
      tags:
        - Notifications
      summary: Benachrichtigung verwerfen
      operationId: dismissNotification
      security:
        - bearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Erfolgreich verworfen
        '404':
          description: Benachrichtigung nicht gefunden

  /api/v1/notifications/clear:
    post:
      tags:
        - Notifications
      summary: Alle Benachrichtigungen löschen
      operationId: clearNotifications
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Optional nach Typ filtern
      responses:
        '200':
          description: Erfolgreich gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      cleared_count:
                        type: integer

  /api/v1/notifications/subscribe:
    post:
      tags:
        - Notifications
      summary: Device für Push-Benachrichtigungen registrieren
      operationId: subscribeDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSubscriptionRequest'
      responses:
        '200':
          description: Device erfolgreich registriert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSubscriptionResponse'

  /api/v1/notifications/unsubscribe:
    post:
      tags:
        - Notifications
      summary: Device abmelden
      operationId: unsubscribeDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Device erfolgreich abgemeldet
        '404':
          description: Device nicht gefunden

  /api/v1/notifications/subscriptions:
    get:
      tags:
        - Notifications
      summary: Alle Device-Subscriptions anzeigen
      operationId: getSubscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste der Subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsListResponse'

  /api/v1/notifications/subscriptions/{device_id}:
    put:
      tags:
        - Notifications
      summary: Subscription-Einstellungen aktualisieren
      operationId: updateSubscription
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: Erfolgreich aktualisiert
        '404':
          description: Device nicht gefunden

  # Home Assistant Integration Endpoints
  /api/v1/notifications/ha/register:
    post:
      tags:
        - Notifications
      summary: HA-Gerät registrieren
      operationId: registerHADevice
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HA-Gerät erfolgreich registriert

  /api/v1/notifications/ha/devices:
    get:
      tags:
        - Notifications
      summary: HA-Geräte auflisten
      operationId: getHADevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste der HA-Geräte

  /api/v1/notifications/ha/devices/{device_id}:
    delete:
      tags:
        - Notifications
      summary: HA-Gerät abmelden
      operationId: unregisterHADevice
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HA-Gerät erfolgreich abgemeldet

  /api/v1/notifications/ha/devices/{device_id}/enable:
    post:
      tags:
        - Notifications
      summary: HA-Gerät aktivieren
      operationId: enableHADevice
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Gerät aktiviert

  /api/v1/notifications/ha/devices/{device_id}/disable:
    post:
      tags:
        - Notifications
      summary: HA-Gerät deaktivieren
      operationId: disableHADevice
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Gerät deaktiviert

  /api/v1/notifications/send/ha:
    post:
      tags:
        - Notifications
      summary: Über HA Notify Service senden
      operationId: sendViaHA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Über HA gesendet

  /api/v1/notifications/ha/test:
    get:
      tags:
        - Notifications
      summary: HA-Verbindung testen
      operationId: testHAConnection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verbindung erfolgreich

  /api/v1/notifications/ha/services:
    get:
      tags:
        - Notifications
      summary: Verfügbare HA Notify Services
      operationId: getHAServices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste der Services

  # Analytics Endpoints
  /api/v1/notifications/stats:
    get:
      tags:
        - Notifications
      summary: Statistiken anzeigen
      operationId: getNotificationStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiken nach Quelle, Priorität, Typ

  /api/v1/notifications/pending:
    get:
      tags:
        - Notifications
      summary: Ausstehende Benachrichtigungen
      operationId: getPendingNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste ausstehender Benachrichtigungen

  /api/v1/notifications/digest:
    get:
      tags:
        - Notifications
      summary: Zusammenfassung anzeigen
      operationId: getDigest
      security:
        - bearerAuth: []
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Zusammenfassung

  # =============================================================================
  # SHARING API
  # =============================================================================
  /api/v1/sharing/entities:
    get:
      tags:
        - Sharing
      summary: Alle registrierten Entities
      operationId: getEntities
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste der Entities
    post:
      tags:
        - Sharing
      summary: Entity für Sharing registrieren
      operationId: registerEntity
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entity_id
              properties:
                entity_id:
                  type: string
                shared:
                  type: boolean
                  default: true
                home_id:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: Entity registriert

  /api/v1/sharing/entities/shared:
    get:
      tags:
        - Sharing
      summary: Geteilte Entities (gefiltert)
      operationId: getSharedEntities
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste geteilter Entities

  /api/v1/sharing/entities/{entity_id}:
    get:
      tags:
        - Sharing
      summary: Einzelne Entity abrufen
      operationId: getEntity
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity-Details
        '404':
          description: Nicht gefunden
    put:
      tags:
        - Sharing
      summary: Entity-Konfiguration aktualisieren
      operationId: updateEntity
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aktualisiert
        '404':
          description: Nicht gefunden
    delete:
      tags:
        - Sharing
      summary: Entity abmelden
      operationId: unregisterEntity
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Abgemeldet

  /api/v1/sharing/entities/{entity_id}/share-with:
    post:
      tags:
        - Sharing
      summary: Entity mit anderem Haushalt teilen
      operationId: shareWithHome
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - home_id
              properties:
                home_id:
                  type: string
      responses:
        '200':
          description: Geteilt
        '404':
          description: Entity nicht gefunden

  /api/v1/sharing/entities/{entity_id}/stop-sharing/{home_id}:
    post:
      tags:
        - Sharing
      summary: Teilen mit Haushalt beenden
      operationId: stopSharingWithHome
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
        - name: home_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Teilen beendet

  /api/v1/sharing/entities/{entity_id}/shared-with:
    get:
      tags:
        - Sharing
      summary: Geteilte Haushalte anzeigen
      operationId: getSharedWith
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste der Haushalte

  /api/v1/sharing/sync/status:
    get:
      tags:
        - Sharing
      summary: Sync-Service Status
      operationId: getSyncStatus
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Sync-Status

  /api/v1/sharing/sync/entities:
    get:
      tags:
        - Sharing
      summary: Synchronisierte Entities
      operationId: getSyncedEntities
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste synchronisierter Entities

  /api/v1/sharing/sync/entities/{entity_id}:
    get:
      tags:
        - Sharing
      summary: Einzelne synchronisierte Entity
      operationId: getSyncedEntity
      security:
        - apiKeyAuth: []
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity-Details
        '404':
          description: Nicht gefunden

  /api/v1/sharing/sync/peers:
    get:
      tags:
        - Sharing
      summary: Sync-Peers anzeigen
      operationId: getSyncPeers
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste der Peers

  /api/v1/sharing/discovery/peers:
    get:
      tags:
        - Sharing
      summary: Entdeckte CoPilot Peers
      operationId: getDiscoveredPeers
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste entdeckter Peers

  /api/v1/sharing/discovery/local:
    get:
      tags:
        - Sharing
      summary: Lokale Peer-Information
      operationId: getLocalPeerInfo
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Lokale Peer-Daten

  /api/v1/sharing:
    get:
      tags:
        - Sharing
      summary: Gesamtstatus (Registry, Sync, Discovery)
      operationId: getSharingStatus
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Gesamtstatus

  # =============================================================================
  # FEDERATED LEARNING API
  # =============================================================================
  /api/v1/federated:
    get:
      tags:
        - Federated Learning
      summary: Service-Status
      operationId: getFederatedStatus
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Status-Informationen
    post:
      tags:
        - Federated Learning
      summary: Service starten
      operationId: startFederatedService
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Service gestartet

  /api/v1/federated/start:
    post:
      tags:
        - Federated Learning
      summary: Service starten
      operationId: startService
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Service gestartet

  /api/v1/federated/stop:
    post:
      tags:
        - Federated Learning
      summary: Service stoppen
      operationId: stopService
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Service gestoppt

  /api/v1/federated/register:
    post:
      tags:
        - Federated Learning
      summary: Home Node registrieren
      operationId: registerNode
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_id
              properties:
                node_id:
                  type: string
                max_epsilon:
                  type: number
                  default: 1.0
      responses:
        '200':
          description: Node registriert

  /api/v1/federated/update:
    post:
      tags:
        - Federated Learning
      summary: Lokales Model-Update einreichen
      operationId: submitUpdate
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_id
                - weights
              properties:
                node_id:
                  type: string
                weights:
                  type: object
                metrics:
                  type: object
      responses:
        '200':
          description: Update eingereicht

  /api/v1/federated/round:
    post:
      tags:
        - Federated Learning
      summary: Neue Federated Learning Runde starten
      operationId: startRound
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Runde gestartet
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  round_id:
                    type: string

  /api/v1/federated/aggregate:
    post:
      tags:
        - Federated Learning
      summary: Aggregation ausführen
      operationId: executeAggregation
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - round_id
              properties:
                round_id:
                  type: string
      responses:
        '200':
          description: Aggregation erfolgreich

  /api/v1/federated/knowledge:
    post:
      tags:
        - Federated Learning
      summary: Wissen extrahieren
      operationId: extractKnowledge
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_id
                - knowledge_type
                - payload
              properties:
                node_id:
                  type: string
                knowledge_type:
                  type: string
                payload:
                  type: object
                confidence:
                  type: number
                  default: 1.0
      responses:
        '200':
          description: Wissen extrahiert

  /api/v1/federated/knowledge/{knowledge_id}/transfer:
    post:
      tags:
        - Federated Learning
      summary: Wissen zu anderem Node transferieren
      operationId: transferKnowledge
      security:
        - apiKeyAuth: []
      parameters:
        - name: knowledge_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_node_id
              properties:
                target_node_id:
                  type: string
      responses:
        '200':
          description: Transfer erfolgreich

  /api/v1/federated/rounds:
    get:
      tags:
        - Federated Learning
      summary: Runden-Historie
      operationId: getRoundHistory
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste der Runden

  /api/v1/federated/models:
    get:
      tags:
        - Federated Learning
      summary: Aggregierte Modelle
      operationId: getAggregatedModels
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste der Modelle

  /api/v1/federated/knowledge-base:
    get:
      tags:
        - Federated Learning
      summary: Wissensbasis anzeigen
      operationId: getKnowledgeBase
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Wissensbasis

  /api/v1/federated/statistics:
    get:
      tags:
        - Federated Learning
      summary: Federated Learning Statistiken
      operationId: getStatistics
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Statistiken

  /api/v1/federated/save:
    post:
      tags:
        - Federated Learning
      summary: Zustand speichern
      operationId: saveState
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  default: /config/.copilot/federated_state.json
      responses:
        '200':
          description: Gespeichert

  /api/v1/federated/load:
    post:
      tags:
        - Federated Learning
      summary: Zustand laden
      operationId: loadState
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  default: /config/.copilot/federated_state.json
      responses:
        '200':
          description: Geladen

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    authTokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Auth Token (preferred since v13.5.3)
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key (deprecated since v13.5.3, use X-Auth-Token instead)

  schemas:
    NotificationRequest:
      type: object
      required:
        - title
        - message
      properties:
        title:
          type: string
        message:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal
        type:
          type: string
          enum: [mood_change, alert, suggestion, system, info, warning]
          default: info
        action_data:
          type: object
        action_url:
          type: string
        target_devices:
          type: array
          items:
            type: string
        target_users:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    NotificationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            notification_id:
              type: string
            timestamp:
              type: string

    NotificationsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            unread_count:
              type: integer
            total_count:
              type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        priority:
          type: string
        type:
          type: string
        timestamp:
          type: string
        read:
          type: boolean
        dismissed:
          type: boolean
        tags:
          type: array
          items:
            type: string

    DeviceSubscriptionRequest:
      type: object
      required:
        - device_id
      properties:
        device_id:
          type: string
        device_name:
          type: string
        device_type:
          type: string
          enum: [mobile, tablet, watch, speaker]
          default: mobile
        push_token:
          type: string
        ha_entity_id:
          type: string
        preferences:
          type: object
          properties:
            notify_mood:
              type: boolean
            notify_alerts:
              type: boolean
            notify_suggestions:
              type: boolean
