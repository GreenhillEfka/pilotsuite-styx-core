        required: false
        schema:
          type: string
      - name: hops
        in: query
        description: Number of hops for neighborhood
        required: false
        schema:
          type: integer
          default: 1
      - name: limitNodes
        in: query
        description: Maximum nodes to return
        required: false
        schema:
          type: integer
          default: 100
      - name: nocache
        in: query
        description: Bypass cache
        required: false
        schema:
          type: boolean
          default: false
      security:
      - apiKeyAuth: []
