  /api/webhook/{webhook_id}:
    post:
      summary: Receive Core->HA webhook event
      description: |
        Core sends events to this endpoint as typed envelopes:
        `{"type": "status|mood|neuron|suggestion", "data": {...}}`.

        Canonical type aliases accepted in transition mode:
        - `mood_changed` → `mood`
        - `neuron_update` → `neuron`
        - `suggestion_new` → `suggestion`

        Alias mode (`PILOTSUITE_WEBHOOK_ALIAS_MODE`):
        - `transition` (default): legacy aliases are mapped to canonical types.
        - `sunset` / `disabled` / `off` / `false` / `0`: legacy aliases are rejected.

        Contract schemas:
        - `pilotsuite_ops/schemas/webhook_envelope.schema.json`
        - `pilotsuite_ops/schemas/webhook_response.schema.json`
      operationId: receiveWebhookEvent
      tags:
      - Hub
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        description: HA webhook ID generated by Home Assistant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEnvelope'
            examples:
              status_event:
                summary: Canonical status envelope
                value:
                  type: status
                  data:
                    online: true
                    version: "13.9.0"
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSuccessResponse'
              examples:
                success:
                  summary: Success
                  value:
                    ok: true
        '400':
          description: Invalid request payload (missing/invalid envelope data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookErrorResponse'
              examples:
                missing_type:
                  summary: Missing envelope type
                  value:
                    ok: false
                    error:
                      code: missing_type
                      message: Webhook envelope must include a non-empty 'type' field.
                      details:
                        required_field: type
                missing_data:
                  summary: Missing envelope data
                  value:
                    ok: false
                    error:
                      code: missing_data
                      message: Webhook envelope must include a 'data' field.
                      details:
                        required_field: data
                unknown_type:
                  summary: Unsupported event type
                  value:
                    ok: false
                    error:
                      code: unknown_type
                      message: Unsupported webhook event type.
                      details:
                        received: mystery_event
                        allowed:
                        - status
                        - mood
                        - neuron
                        - suggestion
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid or missing token
                  value:
                    ok: false
                    error:
                      code: invalid_token
                      message: Webhook auth token is missing or invalid.
                      details:
                        sources:
                        - canonical
                legacy_header_sunset:
                  summary: Legacy header no longer accepted
                  value:
                    ok: false
                    error:
                      code: legacy_header_sunset
                      message: Legacy webhook auth header is no longer accepted after the configured sunset interval.
                      details:
                        header: X-API-Key
                        mode: sunset
                        sunset_at: "2026-03-07T00:00:00Z"
                        sunset_at_raw: "2026-03-07T00:00:00Z"

                missing_signature_headers:
                  summary: Signing enabled but headers missing
                  value:
                    ok: false
                    error:
                      code: missing_signature_headers
                      message: Webhook signature verification is enabled but required signature headers are missing or invalid.
                      details:
                        missing:
                        - X-Signature
                        - X-Signature-Timestamp
                        - X-Signature-Nonce
                stale_timestamp:
                  summary: Signature timestamp outside TTL
                  value:
                    ok: false
                    error:
                      code: stale_timestamp
                      message: Webhook signature timestamp is outside the allowed TTL window.
                      details:
                        ttl_seconds: 300
                        timestamp: 1710000000
                replay_detected:
                  summary: Nonce replay detected
                  value:
                    ok: false
                    error:
                      code: replay_detected
                      message: Webhook nonce replay detected within the allowed TTL window.
                      details:
                        ttl_seconds: 300
                invalid_signature:
                  summary: Signature verification failed
                  value:
                    ok: false
                    error:
                      code: invalid_signature
                      message: Webhook signature verification failed.
      security:
      - apiKeyAuth: []
