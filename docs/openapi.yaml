openapi: 3.0.3
info:
  title: PilotSuite Styx Core API
  description: "\n# PilotSuite Styx Core API Documentation\n\nComprehensive REST API\
    \ documentation for the PilotSuite Styx Core home automation platform.\n\n## Architecture\n\
    \nPilotSuite Styx Core is a modular home automation backend built on Flask, providing:\n\
    \n- **Smart Home Integration**: Native Home Assistant integration with bi-directional\
    \ sync\n- **AI-Powered Automation**: Pattern mining, habitus learning, and predictive\
    \ automation\n- **Multi-Home Support**: Cross-home entity sharing and federated\
    \ learning\n- **Real-time Monitoring**: System health, energy tracking, and network\
    \ diagnostics\n- **Notification Engine**: Multi-channel notifications with digest\
    \ and scheduling\n\n## Authentication\n\nAll API endpoints require authentication\
    \ via one of the following methods:\n\n### API Key Authentication\nMost endpoints\
    \ use API Key authentication via the `X-API-Key` header:\n```\nX-API-Key: your-api-key-here\n\
    ```\n\n### Bearer Token Authentication\nSome endpoints (Notifications, Telegram)\
    \ use Bearer token authentication:\n```\nAuthorization: Bearer your-token-here\n\
    ```\n\n## Versioning\n\nAPI versioning is supported via the `Accept-Version` header:\n\
    ```\nAccept-Version: v1\n```\n\nDeprecated endpoints include `Deprecation` and\
    \ `Sunset` headers in responses.\n\n## Response Format\n\nAll responses follow\
    \ a consistent JSON structure:\n```json\n{\n  \"status\": \"success\",\n  \"data\"\
    : { ... },\n  \"metadata\": {\n    \"timestamp\": \"2026-03-01T10:00:00Z\",\n\
    \    \"version\": \"v1\"\n  }\n}\n```\n\nError responses include:\n```json\n{\n\
    \  \"status\": \"error\",\n  \"error\": {\n    \"code\": \"ERROR_CODE\",\n   \
    \ \"message\": \"Human-readable error message\",\n    \"details\": { ... }\n \
    \ }\n}\n```\n"
  version: 13.5.0
  contact:
    name: PilotSuite
    url: https://github.com/GreenhillEfka/pilotsuite-styx-core
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
