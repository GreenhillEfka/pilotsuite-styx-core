openapi: 3.0.3
info:
  title: PilotSuite Core API
  version: 20.0.0
  description: OpenAPI-Inventur des aktuellen v20-Core-Baums. Öffentliche Runtime-Surface
    derzeit `/health`, `/version`, `/api/v1/presence`, `/api/v1/analytics`, `/api/v1/notifications`,
    `/api/v1/notifications/send`, `/api/v1/notifications/digest`, `/api/v1/notifications/pending`,
    `/api/v1/notifications/stats`, `/api/v1/notifications/{notification_id}`, `/api/v1/notifications/{notification_id}/read`,
    `/api/v1/notifications/subscribe`, `/api/v1/notifications/subscriptions`, `/api/v1/notifications/subscriptions/{device_id}`,
    `/api/v1/notifications/unsubscribe`, `/api/v1/zones` und `/api/v1/widgets/positions*`;
    Legacy-Endpunkte außerhalb dieser inventarisierten Surface sind bewusst nicht
    Teil dieser Runtime.
servers:
- url: http://localhost:8000
  description: PilotSuite Core local runtime
tags:
- name: System
  description: Runtime basics
- name: Presence
  description: Read-only household presence summary
- name: Analytics
  description: Read-only analytics overview
- name: Notifications
  description: Read-only notification feed
- name: Zones
  description: Read-only habitus zone catalog
- name: Dashboard
  description: Dashboard widget layout and persistence
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      operationId: getHealth
      responses:
        200:
          description: Service is healthy
  /version:
    get:
      tags:
      - System
      summary: Runtime version
      operationId: getVersion
      responses:
        200:
          description: Runtime version manifest
  /api/v1/presence:
    get:
      tags:
      - Presence
      summary: Read-only household presence summary
      operationId: getPresenceSummary
      responses:
        200:
          description: Historical v20-derived presence summary snapshot
  /api/v1/analytics:
    get:
      tags:
      - Analytics
      summary: Read-only analytics overview
      operationId: getAnalyticsOverview
      responses:
        200:
          description: Historical v20-derived analytics overview snapshot
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: Read-only notification feed
      operationId: getNotifications
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Maximum number of notifications to return
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
        description: If true, only unread notifications are returned
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Optional exact notification type filter
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Optional exact notification source filter
      responses:
        200:
          description: Read-only notification feed snapshot
        400:
          description: Invalid limit parameter
    post:
      tags:
      - Notifications
      summary: Create one notification via root alias with legacy data/channel/source and integer-priority compatibility
      operationId: createNotification
      responses:
        '200':
          description: Notification created and added to the runtime feed via the root alias; historical `data`, `channel`, `source` and integer `priority` payload hints stay accepted without reintroducing delivery routing
        '400':
          description: Invalid notification payload
  /api/v1/notifications/send:
    post:
      tags:
      - Notifications
      summary: Send one notification with legacy data/channel/source and integer-priority compatibility
      operationId: sendNotification
      responses:
        '200':
          description: Notification created and added to the runtime feed; historical `data`, `channel`, `source` and integer `priority` payload hints stay accepted without reintroducing delivery routing
        '400':
          description: Invalid notification payload
  /api/v1/notifications/digest:
    get:
      tags:
      - Notifications
      summary: Read-only notification digest
      operationId: getNotificationsDigest
      responses:
        200:
          description: Read-only notification digest snapshot
  /api/v1/notifications/pending:
    get:
      tags:
      - Notifications
      summary: Read-only pending notification queue
      operationId: getPendingNotifications
      responses:
        200:
          description: Read-only pending notification delivery snapshot
  /api/v1/notifications/stats:
    get:
      tags:
      - Notifications
      summary: Read-only notification stats
      operationId: getNotificationsStats
      responses:
        200:
          description: Read-only notification stats snapshot
  /api/v1/notifications/{notification_id}:
    parameters:
    - name: notification_id
      in: path
      required: true
      schema:
        type: string
      description: Stable notification id
    delete:
      tags:
      - Notifications
      summary: Dismiss one notification
      operationId: dismissNotification
      responses:
        '200':
          description: Notification marked as dismissed
        '404':
          description: Notification not found
  /api/v1/notifications/{notification_id}/read:
    parameters:
    - name: notification_id
      in: path
      required: true
      schema:
        type: string
      description: Stable notification id
    post:
      tags:
      - Notifications
      summary: Mark one notification as read
      operationId: markNotificationRead
      responses:
        200:
          description: Notification marked as read
        404:
          description: Notification not found
  /api/v1/notifications/subscribe:
    post:
      tags:
      - Notifications
      summary: Subscribe, refresh or re-enable one notification device
      operationId: subscribeNotificationDevice
      responses:
        200:
          description: Notification subscription created, refreshed or re-enabled
        400:
          description: Invalid subscribe payload
  /api/v1/notifications/subscriptions:
    get:
      tags:
      - Notifications
      summary: Read-only notification subscriptions
      operationId: getNotificationSubscriptions
      responses:
        200:
          description: Read-only notification subscription snapshot
  /api/v1/notifications/subscriptions/{device_id}:
    parameters:
    - name: device_id
      in: path
      required: true
      schema:
        type: string
      description: Stable device subscription id
    put:
      tags:
      - Notifications
      summary: Update one notification subscription
      operationId: updateNotificationSubscription
      responses:
        200:
          description: Notification subscription updated
        400:
          description: Invalid subscription update payload
        404:
          description: Device subscription not found
  /api/v1/notifications/unsubscribe:
    post:
      tags:
      - Notifications
      summary: Unsubscribe one notification device
      operationId: unsubscribeNotificationDevice
      responses:
        200:
          description: Notification subscription removed
        400:
          description: Invalid unsubscribe payload
        404:
          description: Device subscription not found
  /api/v1/zones:
    get:
      tags:
      - Zones
      summary: List habitus zones
      operationId: listZones
      parameters:
      - name: zone_type
        in: query
        required: false
        schema:
          type: string
        description: Optional exact zone type filter
      responses:
        200:
          description: Read-only zone catalog
        400:
          description: Invalid zone type filter
  /api/v1/widgets/positions:
    get:
      tags:
      - Dashboard
      summary: List all widget positions
      operationId: listWidgetPositions
      responses:
        200:
          description: All persisted widget positions
    post:
      tags:
      - Dashboard
      summary: Create or overwrite a widget position
      operationId: saveWidgetPosition
      responses:
        200:
          description: Widget position saved
        400:
          description: Validation error
  /api/v1/widgets/positions/bulk:
    post:
      tags:
      - Dashboard
      summary: Save multiple widget positions
      operationId: saveBulkWidgetPositions
      responses:
        200:
          description: Bulk result
        400:
          description: Missing positions payload
  /api/v1/widgets/positions/{widget_id}:
    parameters:
    - name: widget_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Dashboard
      summary: Get one widget position
      operationId: getWidgetPosition
      responses:
        200:
          description: Widget position found
        404:
          description: Widget position not found
    delete:
      tags:
      - Dashboard
      summary: Delete one widget position
      operationId: deleteWidgetPosition
      responses:
        200:
          description: Widget position deleted
        404:
          description: Widget position not found
  /api/v1/widgets/positions/{widget_id}/history:
    post:
      tags:
      - Dashboard
      summary: Append current position to history
      operationId: appendWidgetPositionHistory
      parameters:
      - name: widget_id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: History entry recorded
        400:
          description: Missing payload
        404:
          description: Widget position not found
  /api/v1/widgets/positions/{widget_id}/undo:
    post:
      tags:
      - Dashboard
      summary: Undo the last widget position change
      operationId: undoWidgetPosition
      parameters:
      - name: widget_id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: Undo applied
        404:
          description: Widget position missing or no history available
  /api/v1/widgets/positions/{widget_id}/redo:
    post:
      tags:
      - Dashboard
      summary: Redo the last undone widget position change
      operationId: redoWidgetPosition
      parameters:
      - name: widget_id
        in: path
        required: true
        schema:
          type: string
      responses:
        200:
          description: Redo applied
        404:
          description: Widget position missing or no redo available
  /api/v1/widgets/positions/reset:
    post:
      tags:
      - Dashboard
      summary: Reset all widget positions
      operationId: resetWidgetPositions
      responses:
        200:
          description: All widget positions reset
