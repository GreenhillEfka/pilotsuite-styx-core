  /api/v1/system_health:
    get:
      summary: Get complete system health status
      description: Returns comprehensive system health including CPU, memory, disk,
        network, and service status.
      operationId: getSystemHealth
      tags:
      - System Health
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  cpu:
                    type: object
                    properties:
                      usage_percent:
                        type: number
                        example: 23.5
                      cores:
                        type: integer
                        example: 4
                      temperature:
                        type: number
                        example: 45.2
                  memory:
                    type: object
                    properties:
                      total_mb:
                        type: integer
                        example: 8192
                      used_mb:
                        type: integer
                        example: 4096
                      percent:
                        type: number
                        example: 50.0
                  disk:
                    type: object
                    properties:
                      total_gb:
                        type: number
                        example: 128
                      used_gb:
                        type: number
                        example: 64
                      percent:
                        type: number
                        example: 50.0
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - running
                          - stopped
                          - error
      security:
      - apiKeyAuth: []
  /api/v1/system_health/zigbee:
    get:
      summary: Get Zigbee mesh health
      description: Returns Zigbee network health including signal quality, routing
        tables, and device status.
      operationId: getZigbeeHealth
      tags:
      - System Health
      - Zigbee
      responses:
        '200':
          description: Zigbee mesh health
          content:
            application/json:
              schema:
                type: object
                properties:
                  coordinator:
                    type: object
                    properties:
                      ieee:
                        type: string
                        example: 00:12:4b:00:12:34:56:78
                      status:
                        type: string
                      channel:
                        type: integer
                        example: 15
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        ieee:
                          type: string
                        nwk:
                          type: string
                        lqi:
                          type: integer
                        rssi:
                          type: integer
      parameters:
      - name: force
        in: query
        description: Force refresh from coordinator
        required: false
        schema:
          type: boolean
          default: false
      security:
      - apiKeyAuth: []
  /api/v1/system_health/zwave:
