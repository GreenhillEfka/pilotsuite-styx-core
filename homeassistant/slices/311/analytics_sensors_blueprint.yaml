# PilotSuite Advanced Analytics Sensors Blueprint
# Home Assistant Blueprint for creating analytics sensors
# 
# This blueprint creates sensors that fetch data from the PilotSuite Advanced Analytics API
# and exposes them as Home Assistant entities for use in dashboards and automations.

blueprint:
  name: PilotSuite Advanced Analytics Sensors
  description: >
    Creates sensors for PilotSuite Advanced Analytics data including system health,
    module health scores, event counts, and trend indicators.
  domain: automation
  source_url: https://github.com/pilotsuite/styx-core/blob/current/homeassistant/slices/311/analytics_dashboard_card.yaml
  author: PilotSuite Team
  input:
    pilotsuite_api_url:
      name: PilotSuite API URL
      description: Base URL for the PilotSuite API (e.g., http://homeassistant.local:8123/api)
      default: "http://homeassistant.local:8123/api"
    pilotsuite_api_token:
      name: PilotSuite API Token
      description: Long-lived access token for PilotSuite API authentication
      default: ""
    refresh_interval:
      name: Refresh Interval
      description: How often to fetch analytics data (in minutes)
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

variables:
  api_url: !input pilotsuite_api_url
  api_token: !input pilotsuite_api_token
  refresh_minutes: !input refresh_interval

trigger:
  - platform: time_pattern
    minutes: "/[[[ return refresh_minutes; ]]]"
  - platform: homeassistant
    event: start

action:
  - repeat:
      count: 5
      sequence:
        - delay:
            seconds: 2
        - action: rest.get
          data:
            url: "{{ api_url }}/v1/analytics/overview"
            headers:
              Authorization: "Bearer {{ api_token }}"
            timeout: 10
          response_variable: analytics_response
          continue_on_error: true
        - if:
            - condition: template
              value_template: "{{ analytics_response.status_code == 200 }}"
          then:
            - break
  - if:
      - condition: template
        value_template: "{{ analytics_response.status_code == 200 }}"
    then:
      - action: python_script.parse_analytics_data
        data:
          response_data: "{{ analytics_response.data }}"
    else:
      - action: system_log.write
        data:
          message: "Failed to fetch PilotSuite analytics data: {{ analytics_response.status_code }}"
          level: error

# Note: This blueprint requires the following Python script to be installed:
# /config/python_scripts/parse_analytics_data.py
#
# The script parses the API response and creates/updates sensors for:
# - sensor.pilotsuite_system_health
# - sensor.pilotsuite_total_events
# - sensor.pilotsuite_acceptance_rate
# - sensor.pilotsuite_zone_truth_health
# - sensor.pilotsuite_proposal_lifecycle_health
# - sensor.pilotsuite_action_closure_health
# - sensor.pilotsuite_brain_neuron_health
# - sensor.pilotsuite_chat_rag_health
# - sensor.pilotsuite_attention_count
