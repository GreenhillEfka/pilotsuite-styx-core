<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PilotSuite Styx - Habitus Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drag_drop.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="logo">
                    <h1><i class="mdi mdi-home-automation"></i> PilotSuite Styx</h1>
                    <span class="version">v13.0.3</span>
                </div>
                <div class="header-status">
                    <span class="status-indicator" id="connection-indicator"></span>
                    <span id="connection-status">Verbinde...</span>
                    <span class="theme-toggle" id="theme-toggle" title="Theme umschalten">
                        <i class="mdi mdi-brightness-auto"></i>
                    </span>
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <div class="tabs-container" id="tabs-container">
                <!-- Tabs werden dynamisch generiert -->
            </div>
            <div class="tabs-scroll-indicators">
                <button class="scroll-btn scroll-left" id="scroll-left" disabled>
                    <i class="mdi mdi-chevron-left"></i>
                </button>
                <button class="scroll-btn scroll-right" id="scroll-right">
                    <i class="mdi mdi-chevron-right"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Loading State -->
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner">
                    <i class="mdi mdi-loading mdi-spin"></i>
                    <p>Home Assistant Discovery läuft...</p>
                </div>
            </div>

            <!-- Tab Content Areas -->
            <div class="tab-content-wrapper" id="tab-content-wrapper">
                <!-- Tab-Inhalte werden dynamisch generiert -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <div class="footer-content">
                <span class="last-update">Letztes Update: <span id="last-update-time">--:--:--</span></span>
                <span class="active-alerts" id="active-alerts-count">
                    <i class="mdi mdi-alert-circle"></i>
                    <span id="alert-badge">0</span>
                </span>
            </div>
        </footer>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Vision 3D Modules -->
    <script src="{{ url_for('static', filename='js/vision3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/canvas_view.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag_drop.js') }}"></script>
    
    <!-- 3D Vision Initialization -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 3D Vision Container erstellen
        const visionContainer = document.createElement('div');
        visionContainer.id = 'vision3d-container';
        visionContainer.style.cssText = `
            position: fixed;
            top: 120px;
            right: 24px;
            width: 400px;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
        `;
        document.body.appendChild(visionContainer);
        
        // Vision 3D initialisieren (wenn aktiviert)
        window.initVision3D = () => {
            if (window.vision3d) return;
            
            visionContainer.style.display = 'block';
            window.vision3d = new Vision3D('vision3d-container', {
                width: 400,
                height: 300,
                showGrid: true,
                showAxes: false
            });
            
            // Canvas View Integration
            window.canvasView = new CanvasView('vision3d-container');
            window.canvasView.connectToVision3D(window.vision3d);
            
            // Zonen erstellen (Demo)
            const zones = [
                { id: 'wohn', name: 'Wohnen', position: { x: 0, y: 0, z: 0 }, size: { x: 8, y: 3, z: 6 }, color: 0x3b82f6, sensors: [{ type: 'temperature' }, { type: 'motion' }] },
                { id: 'bad', name: 'Bad', position: { x: 10, y: 0, z: 0 }, size: { x: 4, y: 3, z: 4 }, color: 0x06b6d4, sensors: [{ type: 'humidity' }, { type: 'temperature' }] },
                { id: 'koch', name: 'Küche', position: { x: -10, y: 0, z: 0 }, size: { x: 5, y: 3, z: 6 }, color: 0xf59e0b, sensors: [{ type: 'temperature' }, { type: 'light' }] }
            ];
            
            zones.forEach(zone => window.vision3d.createZone(zone));
            
            // Canvas View Controls Button hinzufügen
            const controls = document.createElement('div');
            controls.className = 'vision3d-controls';
            controls.style.cssText = `
                position: absolute;
                bottom: 8px;
                left: 8px;
                display: flex;
                gap: 8px;
                z-index: 101;
            `;
            controls.innerHTML = `
                <button onclick="vision3d.resetCamera()" title="Reset View">
                    <i class="mdi mdi-crop-free"></i>
                </button>
                <button onclick="vision3d.setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')" title="Toggle Theme">
                    <i class="mdi mdi-brightness-6"></i>
                </button>
                <button onclick="document.getElementById('vision3d-container').style.display='none';" title="Close">
                    <i class="mdi mdi-close"></i>
                </button>
            `;
            visionContainer.appendChild(controls);
        };
        
        // Vision Toggle Button zum Header hinzufügen
        const headerStatus = document.querySelector('.header-status');
        if (headerStatus) {
            const visionBtn = document.createElement('button');
            visionBtn.className = 'vision-toggle-btn';
            visionBtn.innerHTML = '<i class="mdi mdi-cube-outline"></i>';
            visionBtn.title = '3D Vision öffnen';
            visionBtn.style.cssText = `
                background: transparent;
                border: none;
                color: var(--text-secondary);
                cursor: pointer;
                padding: 8px;
                border-radius: 8px;
                transition: all 0.2s ease;
            `;
            visionBtn.addEventListener('click', () => {
                const container = document.getElementById('vision3d-container');
                if (container.style.display === 'none' || !container.style.display) {
                    if (!window.vision3d) {
                        window.initVision3D();
                    } else {
                        container.style.display = 'block';
                    }
                } else {
                    container.style.display = 'none';
                }
            });
            headerStatus.insertBefore(visionBtn, headerStatus.firstChild);
        }
    });
    </script>
</body>
</html>
