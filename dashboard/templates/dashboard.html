<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PilotSuite Styx - Habitus Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/drag_drop.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <div class="logo">
                    <h1><i class="mdi mdi-home-automation"></i> PilotSuite Styx</h1>
                    <span class="version">v13.0.3</span>
                </div>
                <div class="header-status">
                    <span class="status-indicator" id="connection-indicator"></span>
                    <span id="connection-status">Verbinde...</span>
                    <span class="theme-toggle" id="theme-toggle" title="Theme umschalten">
                        <i class="mdi mdi-brightness-auto"></i>
                    </span>
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <div class="tabs-container" id="tabs-container">
                <!-- Tabs werden dynamisch generiert -->
            </div>
            <div class="tabs-scroll-indicators">
                <button class="scroll-btn scroll-left" id="scroll-left" disabled>
                    <i class="mdi mdi-chevron-left"></i>
                </button>
                <button class="scroll-btn scroll-right" id="scroll-right">
                    <i class="mdi mdi-chevron-right"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Loading State -->
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner">
                    <i class="mdi mdi-loading mdi-spin"></i>
                    <p>Home Assistant Discovery läuft...</p>
                </div>
            </div>

            <!-- Tab Content Areas -->
            <div class="tab-content-wrapper" id="tab-content-wrapper">
                <!-- Tab-Inhalte werden dynamisch generiert -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <div class="footer-content">
                <span class="last-update">Letztes Update: <span id="last-update-time">--:--:--</span></span>
                <span class="active-alerts" id="active-alerts-count">
                    <i class="mdi mdi-alert-circle"></i>
                    <span id="alert-badge">0</span>
                </span>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/drag_drop.js') }}"></script>
</body>
</html>
