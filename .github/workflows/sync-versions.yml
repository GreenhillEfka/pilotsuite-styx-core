name: Sync HA+Core Versions

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/20 * * * *'  # Alle 20 Min
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if versions match'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout both repositories
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: main-repo

      - name: Checkout HA repository
        uses: actions/checkout@v4
        with:
          repository: 'GreenhillEfka/Home-Assistant-Copilot'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ha-repo

      - name: Check Version Sync
        id: check
        run: |
          cd $GITHUB_WORKSPACE/main-repo
          CORE_VER=$(cat VERSION | tr -d '[:space:]')
          HA_VER=$(cat ../ha-repo/VERSION | tr -d '[:space:]')
          
          echo "Core version: $CORE_VER"
          echo "HA version: $HA_VER"
          
          if [ "$CORE_VER" != "$HA_VER" ]; then
            echo "::warning::Version mismatch! Core: $CORE_VER, HA: $HA_VER"
            echo "::warning::Auto-fixing HA version..."
            echo "MISMATCH=true" >> $GITHUB_OUTPUT
            echo "TARGET_VERSION=$CORE_VER" >> $GITHUB_OUTPUT
          else
            echo "✅ Versions synchron: v$CORE_VER"
            echo "MISMATCH=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync HA Version
        if: steps.check.outputs.MISMATCH == 'true' || github.event.inputs.force == 'true'
        run: |
          TARGET_VER="${{ steps.check.outputs.TARGET_VERSION }}"
          
          cd $GITHUB_WORKSPACE/ha-repo
          
          # Update VERSION files
          echo "$TARGET_VER" > VERSION
          echo "$TARGET_VER" > copilot_core/VERSION
          
          # Update manifest.json version
          CURRENT_MANIFEST=$(grep -o '"version": "[^"]*"' copilot_core/manifest.json | head -1 | cut -d'"' -f4)
          sed -i "s/\"version\": \"$CURRENT_MANIFEST\"/\"version\": \"$TARGET_VER\"/" copilot_core/manifest.json
          
          # Sync CHANGELOG if exists in main repo
          if [ -f ../main-repo/CHANGELOG.md ]; then
            cp ../main-repo/CHANGELOG.md CHANGELOG.md
          fi
          
          echo "✅ HA version updated to $TARGET_VER"

      - name: Commit and Push
        if: steps.check.outputs.MISMATCH == 'true' || github.event.inputs.force == 'true'
        run: |
          cd $GITHUB_WORKSPACE/ha-repo
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Auto-Sync)"
          
          git add VERSION copilot_core/VERSION copilot_core/manifest.json CHANGELOG.md 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: Auto-sync HA version to Core v${{ steps.check.outputs.TARGET_VERSION }}"
            git push origin main || echo "Push failed (expected for protected branches)"
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Report Status
        run: |
          if [ "${{ steps.check.outputs.MISMATCH }}" == "true" ]; then
            echo "🔧 Auto-Sync completed successfully!"
            echo "HA version is now: ${{ steps.check.outputs.TARGET_VERSION }}"
          else
            echo "✅ No sync needed - versions already match"
          fi
