name: Sync Core and HA Versions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even when versions already match"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: core-repo

      - name: Checkout HA repository
        uses: actions/checkout@v4
        with:
          repository: GreenhillEfka/pilotsuite-styx-ha
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ha-repo

      - name: Compare versions
        id: compare
        run: |
          CORE_VERSION=$(tr -d '[:space:]' < core-repo/addons/pilotsuite/app/VERSION)
          ROOT_CORE_VERSION=$(tr -d '[:space:]' < core-repo/VERSION)
          LEGACY_CORE_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('core-repo/pilotsuite/config.yaml').read_text()
          match = re.search(r'(?m)^version:\s*"([^"]+)"\s*$', text)
          print(match.group(1) if match else '')
          PY
          )
          HA_VERSION=$(tr -d '[:space:]' < ha-repo/VERSION)
          if [ "$CORE_VERSION" != "$ROOT_CORE_VERSION" ] || [ "$CORE_VERSION" != "$LEGACY_CORE_VERSION" ]; then
            echo "Core canonical version files disagree: addons/pilotsuite/app/VERSION=$CORE_VERSION VERSION=$ROOT_CORE_VERSION pilotsuite/config.yaml=$LEGACY_CORE_VERSION"
            exit 1
          fi
          echo "core=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ha=$HA_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CORE_VERSION" != "$HA_VERSION" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update HA canonical version files
        if: steps.compare.outputs.sync == 'true'
        run: |
          export VERSION="${{ steps.compare.outputs.core }}"
          cd ha-repo
          echo "$VERSION" > VERSION
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          readme = Path("README.md")
          readme.write_text(re.sub(r"(?m)^\*\*Version:\*\*\s+.*$", f"**Version:** {version}  ", readme.read_text(), count=1))

          for path_str in ["manifest.json", "custom_components/pilotsuite/manifest.json"]:
              path = Path(path_str)
              data = json.loads(path.read_text())
              data["version"] = version
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Commit and push HA sync
        if: steps.compare.outputs.sync == 'true'
        run: |
          cd ha-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md VERSION manifest.json custom_components/pilotsuite/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ha): sync version to core v${{ steps.compare.outputs.core }}"
            git push origin main
          else
            echo "No version changes needed"
          fi

      - name: Report status
        run: |
          echo "Core version: ${{ steps.compare.outputs.core }}"
          echo "HA version:   ${{ steps.compare.outputs.ha }}"
          echo "Synced:       ${{ steps.compare.outputs.sync }}"
