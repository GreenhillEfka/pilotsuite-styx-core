name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r addons/pilotsuite/app/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run canonical add-on tests
        env:
          COPILOT_AUTH_REQUIRED: "false"
          PYTHONPATH: addons/pilotsuite/app
        run: |
          python -m pytest addons/pilotsuite/app/copilot_core/tests -q

      - name: Syntax check canonical add-on entrypoints
        run: |
          python -m py_compile addons/pilotsuite/app/copilot_core/app.py
          python -m py_compile addons/pilotsuite/app/main.py
