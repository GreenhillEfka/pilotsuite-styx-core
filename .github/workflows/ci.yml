name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r copilot_core/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          COPILOT_AUTH_REQUIRED: "false"
          PYTHONPATH: copilot_core/rootfs/usr/src/app
        run: |
          python -m pytest copilot_core/rootfs/usr/src/app/tests/ \
            -v --tb=short -q \
            --ignore=copilot_core/rootfs/usr/src/app/tests/test_list_suggestions.py \
            --ignore=copilot_core/rootfs/usr/src/app/tests/test_anomaly_detection.py \
            --ignore=copilot_core/rootfs/usr/src/app/tests/integration/test_neural_network_integration.py \

      - name: Syntax check
        run: |
          python -m py_compile copilot_core/rootfs/usr/src/app/copilot_core/app.py
          python -m py_compile copilot_core/rootfs/usr/src/app/main.py
