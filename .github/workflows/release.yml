name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 20.0.8"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must match X.Y.Z"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Bump canonical version files
        run: |
          echo "$VERSION" > VERSION
          echo "$VERSION" > addons/pilotsuite/app/VERSION
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          readme = Path("README.md")
          readme.write_text(re.sub(r"(?m)^\*\*Version:\*\*\s+.*$", f"**Version:** {version}  ", readme.read_text(), count=1))

          config = Path("addons/pilotsuite/config.yaml")
          config.write_text(re.sub(r'(?m)^version:\s*"[^"]+"\s*$', f'version: "{version}"', config.read_text(), count=1))
          PY

      - name: Verify canonical version truth
        run: |
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat addons/pilotsuite/app/VERSION)" = "$VERSION"
          grep -q "^\*\*Version:\*\* $VERSION" README.md
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("addons/pilotsuite/config.yaml").read_text()
          match = re.search(r'(?m)^version:\s*"([^"]+)"\s*$', text)
          assert match and match.group(1) == Path("VERSION").read_text().strip()
          print("Canonical version files aligned")
          PY

      - name: Commit and tag
        run: |
          git config user.email "pilotclaw@pilotsuite.dev"
          git config user.name "PilotClaw"
          git add README.md VERSION addons/pilotsuite/config.yaml addons/pilotsuite/app/VERSION
          git commit -m "chore(core): release v$VERSION"
          git tag "$TAG"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "PilotSuite Core $TAG" \
            --notes "Release $TAG" \
            --clobber

      - name: Build and upload ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git archive --format=zip --prefix=pilotsuite-styx-core/ -o "$TAG.zip" HEAD
          gh release upload "$TAG" "$TAG.zip" --clobber

      - name: Verify ZIP contents
        run: |
          unzip -p "$TAG.zip" pilotsuite-styx-core/VERSION
          unzip -p "$TAG.zip" pilotsuite-styx-core/addons/pilotsuite/app/VERSION
          unzip -p "$TAG.zip" pilotsuite-styx-core/addons/pilotsuite/config.yaml | grep '^version:'
