name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 15.2.2)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! printf '%s\n' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must match X.Y.Z format"
            exit 1
          fi

      - name: Bump add-on version files
        run: |
          echo "Bumping to: $VERSION"
          echo "$VERSION" > VERSION
          echo "$VERSION" > addons/pilotsuite/app/VERSION
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION']
          path = Path('addons/pilotsuite/config.yaml')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version:\s*"[^"]+"\s*$', f'version: "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('Failed to update version in addons/pilotsuite/config.yaml')
          path.write_text(text, encoding='utf-8')
          print(f'config.yaml -> {version}')
          PY
          echo "VERSION files updated:"
          cat VERSION
          cat addons/pilotsuite/app/VERSION
          grep '^version:' addons/pilotsuite/config.yaml

      - name: Verify add-on version files match
        run: |
          V_ROOT=$(cat VERSION)
          V_ADDON=$(cat addons/pilotsuite/app/VERSION)
          V_CONFIG=$(python3 - <<'PY'
          import re
          text=open('addons/pilotsuite/config.yaml', encoding='utf-8').read()
          m=re.search(r'(?m)^version:\s*"([^"]+)"\s*$', text)
          print(m.group(1) if m else '')
          PY
          )
          echo "root VERSION:      $V_ROOT"
          echo "app VERSION:       $V_ADDON"
          echo "config.yaml ver:   $V_CONFIG"
          if [ "$V_ROOT" != "$VERSION" ] || [ "$V_ADDON" != "$VERSION" ] || [ "$V_CONFIG" != "$VERSION" ]; then
            echo "ERROR: At least one version file does not match $VERSION"
            exit 1
          fi
          echo "ALL ADD-ON VERSION FILES CONSISTENT ✓"

      - name: Commit version bump
        run: |
          git config --global user.email "pilotclaw@pilotsuite.dev"
          git config --global user.name "PilotClaw"
          git add -A
          git commit -m "chore(core): release v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "PilotSuite Core v$VERSION" \
            --notes "Release v$VERSION" \
            --clobber

      - name: Build and upload ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git archive --format=zip --prefix=pilotsuite-styx-core/ -o "v$VERSION.zip" HEAD
          gh release upload "v$VERSION" "v$VERSION.zip" --clobber

      - name: Verify ZIP contents
        run: |
          ROOT_ZIP_VERSION=$(unzip -p "v$VERSION.zip" pilotsuite-styx-core/VERSION | tr -d '[:space:]')
          APP_ZIP_VERSION=$(unzip -p "v$VERSION.zip" pilotsuite-styx-core/addons/pilotsuite/app/VERSION | tr -d '[:space:]')
          CONFIG_ZIP_VERSION=$(python3 - <<'PY'
          import re
          import subprocess

          text = subprocess.check_output(
              ['unzip', '-p', f'v{__import__("os").environ["VERSION"]}.zip', 'pilotsuite-styx-core/addons/pilotsuite/config.yaml'],
              text=True,
          )
          match = re.search(r'(?m)^version:\s*"([^"]+)"\s*$', text)
          print(match.group(1) if match else '')
          PY
          )
          echo "zip root VERSION:  $ROOT_ZIP_VERSION"
          echo "zip app VERSION:   $APP_ZIP_VERSION"
          echo "zip config.yaml:   $CONFIG_ZIP_VERSION"
          if [ "$ROOT_ZIP_VERSION" != "$VERSION" ] || [ "$APP_ZIP_VERSION" != "$VERSION" ] || [ "$CONFIG_ZIP_VERSION" != "$VERSION" ]; then
            echo "ERROR: ZIP contents do not match $VERSION"
            exit 1
          fi
          echo "ZIP VERSION SURFACES CONSISTENT ✓"
