automation:
  - id: deckenlicht_toggle_steuerung
    alias: "Deckenlicht Toggle per Steuerungs-Button"
    description: "Schaltet das Deckenlicht aus wenn der Steuerungs-Toggle aktiviert wird, und setzt den Toggle zurueck"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.deckenlicht_steuerung
        to: "on"
        from: "off"
    condition:
      - condition: state
        entity_id: light.deckenlicht
        state: "on"
    action:
      - service: light.turn_off
        target:
          entity_id: light.deckenlicht
      - delay:
          milliseconds: 500
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.deckenlicht_steuerung

  - id: deckenlicht_praesenz_auto_aus
    alias: "Deckenlicht Auto-Aus bei Abwesenheit"
    description: "Schaltet das Deckenlicht aus wenn niemand im Raum ist (nach 5 Min Verzoegerung)"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.raum_praesenz
        to: "off"
        from: "on"
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: light.deckenlicht
        state: "on"
    action:
      - service: light.turn_off
        target:
          entity_id: light.deckenlicht
